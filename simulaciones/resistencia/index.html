<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ley de Ohm · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261025071347">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Ley de Ohm</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua con bomba, tramo angosto ajustable y medidor de agua con perilla (presión, caudal, resistencia)"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico con fuente, resistencia ajustable y multímetro con perilla (V, A, Ω)"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261025071347"></script>
<script src="../../assets/banco.js?v=20261025071347"></script>
<script>
(() => {
  const { C, draw: D, fmt } = Sim;
  // 0 Ω es un cortocircuito: solo el límite de corriente de la fuente (o el caudal máximo de la bomba) la detiene.
  // La resistencia se cambia pellizcando el tramo angosto o tocándolo (abre su menú): valores comunes
  // de 100 Ω a 10 kΩ, y abierto del todo es 0 Ω.
  const RMIN = 100, RMAX = 10000, HMIN = 3, HMAX = Sim.PIPE - 3, LN = Math.log(RMAX / RMIN);
  const RVALUES = [0, ...Sim.series(RMIN, RMAX)];
  const half = R => R ? HMAX - (HMAX - HMIN) * Math.log(R / RMIN) / LN : Sim.PIPE;
  const fromHalf = h => h >= Sim.PIPE - 0.5 ? 0 : Sim.nearest(RVALUES, RMIN * Math.exp((HMAX - Math.max(HMIN, Math.min(HMAX, h))) / (HMAX - HMIN) * LN));
  // Los cables tienen 0,05 Ω (para que un corto no sea una división entre 0). El fusible (de 100 mA al
  // empezar) se cambia tocándolo.
  const RW = 0.05, FUSES = [50, 100, 250, 500, 1000];
  const mA = i => i >= 1000 ? fmt(i / 1000, i % 1000 ? 2 : 0) + ' A' : Math.round(i) + ' mA';
  const mLs = i => { const q = i * b.MLS_PER_MA; return q >= 1000 ? fmt(q / 1000, q % 1000 ? 2 : 0) + ' L/s' : Math.round(q) + ' mL/s'; };
  const ohm = Sim.ohm;
  // Calor del fusible y de la resistencia (de ¼ W), ver Sim.heat: el menú de cada uno lo muestra.
  const fh = Sim.heat(Sim.HEAT.fuse), rh = Sim.heat(Sim.HEAT.res);
  const st = { R: 1000, fuse: 100, blown: false, breakT: 9, sparks: [], burnt: false, burnT: 9, drops: [] };
  const sides = {};
  const profile = g => Sim.narrowProfile((g.BOT - g.TOP) + (g.PX - g.X0), half(st.R));
  // El fusible (en el agua, una válvula de seguridad) va en el tubo de abajo, a la izquierda.
  const fuseAt = g => [(g.X0 + g.PX - b.SRC) / 2, g.BOT];

  const b = Sim.bench({
    iFull: 30,
    iMax: 3000,   // en cortocircuito sale justo el límite del canal A, que llega hasta 3 A
    v0: 9, lim0: 500,
    layout(g) {
      const s = sides[g.side] = { phase: 0, g };
      if (g.side === 'w') s.water = Sim.water(g.loop, profile(g));
    },
    model: V => ({ I: st.blown || st.burnt ? 0 : V / (st.R + RW) * 1000 }),
    // En cortocircuito la fuente llega a su límite y baja su voltaje casi a 0.
    circuit(g, m, V) {
      // draw y tag: cómo se ve cada uno en la vista de nodos (en su lugar de siempre; el banco lo mueve)
      const fz = { at: fuseAt(g), half: 24, dV: st.blown ? V : 0, R: st.blown ? Infinity : 0, pr: fusePart, ext: w => w ? 22 : 14,
        draw: (ctx, w) => w ? safetyValve(ctx, g) : fuse(ctx, g),
        tag: w => [w ? 'válvula' : 'fusible', w ? mLs(st.fuse) : mA(st.fuse), st.blown, st.blown ? (w ? 'cerrada' : 'fundido') : ''] };   // en nodos va inclinada: el nombre corto
      const res = { at: [g.PX, g.TOP], half: 46, dV: st.blown ? 0 : V, R: st.burnt ? Infinity : st.R, pr: pinch,
        draw: (ctx, w) => {
          const [jx, jy] = jitter();
          if (w) { D.narrow(ctx, g.PX + jx, g.TOP + jy, half(st.R)); burstPipe(ctx, g); return; }
          if (!st.burnt) glowAt(ctx, g.PX, g.TOP, rh.glow);
          D.resistor(ctx, g.PX + jx, g.TOP + jy); burntResistor(ctx, g);
        },
        tag: w => [st.R ? (w ? 'tramo angosto' : 'resistencia') : (w ? 'sin estrechamiento' : 'cortocircuito'), rText(), !st.R || st.burnt, st.burnt ? (w ? 'reventado' : 'quemada') : ''] };
      return [{ pts: b.loopPts(g), I: m.I, v0: V, comps: [fz, res] }];
    },
    step(dt, m) {
      // El fusible se calienta con la corriente al cuadrado, aunque la inercia esté en 0: la corriente llega al
      // instante, pero el hilo tarda en fundirse, y entre más se pasa más rápido (con 500 mA, el límite de la
      // fuente al empezar, un fusible de 100 mA tarda 1 s; con 150 mA, unos 15 s). Va junto a la fuente: le pasa
      // todo lo que ella da, también lo que se va por un multímetro en A que hace un corto (b.iOut).
      if (fh.step(st.blown ? 0 : (b.iOut() / st.fuse) ** 2, dt) && !st.blown) blow();
      // La resistencia se calienta con la potencia P = I²·R; arriba de ¼ W se quema, más rápido entre más
      // se pasa (con 9 V y 100 Ω, unos 3 s; con 220 Ω, unos 9 s; con 330 Ω llega a 152 °C y aguanta). En un corto (0 Ω) no recibe potencia.
      if (rh.step(st.burnt ? 0 : (m.I / 1000) ** 2 * st.R, dt) && !st.burnt) burn();
      st.burnT += dt;
      for (const p of st.drops) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }
      st.breakT += dt;
      for (const p of st.sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
      const r = Math.min(b.flowI(m), 60) * 6;   // las partículas tienen un tope de rapidez para que se puedan ver
      sides.w.water.step(r, dt);
      sides.e.phase += r * dt;
    },
    drawW(ctx, g, m) {
      D.pipe(ctx, g.loop);
      const [jx, jy] = jitter();
      D.narrow(ctx, g.PX + jx, g.TOP + jy, half(st.R));
      sides.w.water.draw(ctx);
      burstPipe(ctx, g);
      safetyValve(ctx, g);
      b.grips(ctx, g.PX, g.TOP, half(st.R) + 5, pinch);
      rTag(ctx, g, true);
    },
    drawE(ctx, g, m) {
      D.wire(ctx, g.loop);
      hot(ctx, g.loop, m);
      D.flow(ctx, g.loop, sides.e.phase, C.charge, { gap: 30, r: 4.5 });
      const [jx, jy] = jitter();
      if (!st.burnt) glowAt(ctx, g.PX, g.TOP, rh.glow);
      D.resistor(ctx, g.PX + jx, g.TOP + jy);
      burntResistor(ctx, g);
      b.grips(ctx, g.PX, g.TOP, half(st.R) + 5, pinch);
      fuse(ctx, g);
      rTag(ctx, g, false);
    }
  });
  const rText = () => st.R ? ohm(st.R) : '0 Ω';
  // «nombre valor» arriba del tramo (de la resistencia) y, si se quemó, su estado en una pastilla
  const rTag = (ctx, g, w) => b.tag(ctx, pinch, g.PX, g.TOP - half(st.R) - 42,
    st.R ? (w ? 'tramo angosto' : 'resistencia') : (w ? 'sin estrechamiento' : 'cortocircuito'), rText(), !st.R || st.burnt, false,
    st.burnt ? (w ? 'reventado' : 'quemada') : '');
  // Cables al rojo: brillan más cuanto más se pasa la corriente de lo que aguanta el fusible. Solo con
  // corriente: fundido el fusible ya no pasa nada y se apagan aunque el fusible siga caliente.
  function hot(ctx, path, m) {
    const k = Math.min(1, Math.max(0, (b.iOut() - st.fuse) / (2 * st.fuse)));
    if (!k) return;
    ctx.globalAlpha = 0.35 * k; D.line(ctx, path, 16, '#ff5a1f'); ctx.globalAlpha = 1;
    D.line(ctx, path, 4, `rgba(255, ${Math.round(110 - 60 * k)}, 30, ${0.4 + 0.6 * k})`);
  }
  // Fusible: cajita con un hilo; al calentarse brilla y tiembla, y al fundirse el hilo se corta con chispas.
  function fuse(ctx, g) {
    const [x0, y] = fuseAt(g), t = performance.now() / 1000;
    const heat = st.blown ? 0 : fh.glow;
    const x = x0 + 2 * heat * Math.sin(t * 50);
    if (heat > 0) {
      const gr = ctx.createRadialGradient(x, y, 3, x, y, 46);
      gr.addColorStop(0, `rgba(255, 120, 40, ${0.8 * heat})`); gr.addColorStop(1, 'rgba(255, 120, 40, 0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 46, 0, Math.PI * 2); ctx.fill();
    }
    const h = 11;
    D.roundRect(ctx, x - 24, y - h, 48, 2 * h, 6, C.card, st.blown ? C.danger : C.ink, 2.5);
    ctx.lineWidth = 2.5; ctx.strokeStyle = heat > 0.3 ? '#ff7a1f' : C.ink;
    if (st.blown) { D.line(ctx, [[x - 24, y], [x - 7, y - 3]], 2.5, C.ink); D.line(ctx, [[x + 7, y + 3], [x + 24, y]], 2.5, C.ink); }
    else D.line(ctx, [[x - 24, y], [x + 24, y]], 2.5, ctx.strokeStyle);
    b.tag(ctx, fusePart, x, y - h - 18, 'fusible', mA(st.fuse), st.blown, false, st.blown ? 'fundido' : '');   // arriba, adentro del circuito: abajo está la fuente
    if (st.breakT < 1.2) {
      ctx.globalAlpha = Math.min(1, (1.2 - st.breakT) / 0.4);
      if (st.breakT < 0.15) D.circle(ctx, x, y, 30, `rgba(255, 230, 150, ${1 - st.breakT / 0.15})`);
      for (const p of st.sparks) D.circle(ctx, x + p.x, y + p.y, 2.5, st.breakT < 0.5 ? '#ffd23c' : '#ff7a2a');
      for (let k = 0; k < 3; k++) {
        const u = Math.max(0, st.breakT - k * 0.15);
        D.circle(ctx, x + (k - 1) * 8, y - 10 - 45 * u, 5 + 14 * u, `rgba(120, 120, 120, ${0.4 * Math.max(0, 1 - u / 1.2)})`);
      }
      ctx.globalAlpha = 1;
    }
  }
  // Válvula de seguridad (de exceso de flujo): una bola sostenida por un resorte dentro de una cámara
  // transparente. Con demasiado flujo el agua la empuja hacia el asiento; si se pasa el tiempo, la
  // bola se asienta de golpe y cierra el tubo. El agua va hacia la izquierda, así que el asiento está ahí.
  function safetyValve(ctx, g) {
    const [x0, y] = fuseAt(g), t = performance.now() / 1000, P = Sim.PIPE, H = P + 7;
    // la bola se acerca al asiento conforme el empuje (el calor del fusible) se acerca a cerrarla
    const push = Math.min(1, fh.f), shake = st.blown ? 0 : 1.5 * fh.glow * Math.sin(t * 60);
    const bx = st.blown ? x0 - 15 : x0 + 12 - 24 * push + shake, by = y;
    ctx.globalAlpha = 0.85; D.roundRect(ctx, x0 - 30, y - H, 60, 2 * H, 8, C['water-soft']); ctx.globalAlpha = 1;
    D.roundRect(ctx, x0 - 30, y - H, 60, 2 * H, 8, null, st.blown ? C.danger : C.ink, 2.5);
    // asiento: dos topes que angostan el paso del lado izquierdo
    ctx.fillStyle = C.ink;
    for (const sg of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x0 - 30, y + sg * H); ctx.lineTo(x0 - 22, y + sg * H); ctx.lineTo(x0 - 22, y + sg * 6); ctx.lineTo(x0 - 30, y + sg * 6); ctx.fill(); }
    // resorte de la pared derecha a la bola
    const xs = x0 + 28, xe = bx + 8, n = 7;
    ctx.beginPath(); ctx.moveTo(xs, y);
    for (let k = 1; k <= n; k++) ctx.lineTo(xs + (xe - xs) * k / n, y + (k === n ? 0 : (k % 2 ? -6 : 6)));
    ctx.lineWidth = 2; ctx.strokeStyle = C.muted; ctx.stroke();
    D.circle(ctx, bx, by, 8, st.blown ? C.danger : C.metal, C.ink, 2);
    // la etiqueta va arriba, adentro del circuito, entre el tubo de la izquierda y la bomba (si no cabe, solo
    // «válvula»)
    const lx = g.X0 + P + 10;   // justo adentro del tubo de la izquierda
    D.tag(ctx, lx, y - H - 22, ['válvula de seguridad', 'válvula'], mLs(st.fuse),
      { sel: fusePart.open(), danger: st.blown, state: st.blown ? 'cerrada' : '', align: 'left', max: g.PX - 44 - lx });
    if (st.breakT < 1) {   // salpicadura al cerrarse de golpe
      ctx.globalAlpha = Math.min(1, (1 - st.breakT) / 0.4);
      for (const p of st.sparks) D.circle(ctx, x0 - 22 + p.x * 0.6, y + p.y * 0.6, 3, C.water);
      ctx.globalAlpha = 1;
    }
  }
  // Mientras se calienta, la resistencia (o el tramo angosto) tiembla.
  function jitter() {
    if (!rh.glow || st.burnt) return [0, 0];
    const t = performance.now() / 1000, a = 1.6 * rh.glow;
    return [a * Math.sin(t * 53), a * Math.cos(t * 41)];
  }
  function glowAt(ctx, x, y, k) {
    const gr = ctx.createRadialGradient(x, y, 4, x, y, 52);
    gr.addColorStop(0, `rgba(255, 110, 30, ${0.75 * k})`); gr.addColorStop(1, 'rgba(255, 110, 30, 0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 52, 0, Math.PI * 2); ctx.fill();
  }
  // Resistencia quemada: tiznada, partida a la mitad y echando humo.
  function burntResistor(ctx, g) {
    if (!st.burnt) return;
    const x = g.PX, y = g.TOP;
    ctx.fillStyle = 'rgba(30, 20, 15, 0.55)'; ctx.beginPath(); ctx.ellipse(x, y, 24, 13, 0, 0, Math.PI * 2); ctx.fill();
    D.line(ctx, [[x - 3, y - 14], [x + 3, y - 4], [x - 3, y + 4], [x + 3, y + 14]], 6, C.card);
    smoke(ctx, x, y - 12);
  }
  // Tramo angosto reventado: una grieta por donde sale el agua; ya no circula.
  function burstPipe(ctx, g) {
    if (rh.glow > 0.5 && !st.burnt) {   // antes de reventar empieza a gotear
      const t = performance.now() / 1000;
      for (let k = 0; k < 3; k++) D.circle(ctx, g.PX - 8 + 8 * k, g.TOP - Sim.PIPE - 4 - ((t * 40 + k * 11) % 14), 2, C.water);
    }
    if (!st.burnt) return;
    const x = g.PX, y = g.TOP, h = half(st.R) + 5;
    D.line(ctx, [[x - 10, y - h], [x - 3, y - h + 5], [x + 3, y - h - 1], [x + 10, y - h + 4]], 3, C.danger);
    if (st.burnT < 1.2) {
      ctx.globalAlpha = Math.min(1, (1.2 - st.burnT) / 0.5);
      for (const p of st.drops) D.circle(ctx, x + p.x, y - h + p.y, 3, C.water);
      ctx.globalAlpha = 1;
    }
  }
  function smoke(ctx, x, y) {
    const t = st.burnT;
    for (let k = 0; k < 4; k++) {
      const u = ((t * 0.5 + k / 4) % 1);
      D.circle(ctx, x + 6 * Math.sin(k * 2 + t), y - 50 * u, 4 + 10 * u, `rgba(110, 110, 110, ${0.35 * (1 - u)})`);
    }
  }
  function burn() {
    st.burnt = true; st.burnT = 0; b.halt();
    st.drops = Array.from({ length: 18 }, () => {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6, v = 120 + 160 * Math.random();
      return { x: (Math.random() - 0.5) * 16, y: 0, vx: Math.cos(a) * v, vy: Math.sin(a) * v };
    });
    b.refresh();
  }
  function blow() {
    st.blown = true; st.breakT = 0; b.halt();
    st.sparks = Array.from({ length: 16 }, () => {
      const a = Math.random() * Math.PI * 2, v = 80 + 160 * Math.random();
      return { x: 0, y: 0, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 };
    });
    b.refresh();
  }

  const pinch = b.pinch({
    pos: g => [g.PX, g.TOP], get: () => st.R, half, fromHalf,
    set: R => { st.R = R; sides.w.water.setProfile(profile(sides.w.g)); },
    label: side => side === 'w' ? 'Tramo angosto' : 'Resistencia',
    text: R => R ? ohm(R) : '0 Ω, cortocircuito',
    menu: side => Sim.resistorMenu({
      values: RVALUES, get: () => st.R, set: setR, format: R => R ? ohm(R) : '0 Ω (corto)', heat: rh, broken: () => st.burnt,
      actions: [{ text: side === 'w' ? 'Poner un tubo nuevo' : 'Poner una resistencia nueva', hidden: () => !st.burnt, onClick: renew }]
    })(side)
  });
  function setR(R) { st.R = R; sides.w.water.setProfile(profile(sides.w.g)); }
  // Poner una resistencia (o un tubo) nueva, desde su tarjeta.
  const renew = () => { st.burnt = false; rh.reset(); st.burnT = 9; };
  // Tocar el fusible (o la válvula) abre su menú: cuánta corriente aguanta, y ponerlo nuevo si se fundió.
  const repair = () => { st.blown = false; fh.reset(); st.breakT = 9; };
  const fusePart = b.part({
    pos: g => fuseAt(g),
    label: side => side === 'w' ? 'Válvula de seguridad' : 'Fusible',
    menu: side => ({
      title: side === 'w' ? 'Válvula de seguridad' : 'Fusible',
      rows: [
        { label: side === 'w' ? 'Cierra arriba de' : 'Aguanta', values: FUSES, get: () => st.fuse, set: v => { st.fuse = v; }, format: side === 'w' ? mLs : mA },
        // lo que aguanta, lo que pasa ahora y cuánto le falta para fundirse (cerrarse)
        { heat: () => {
          const w = side === 'w', f = w ? mLs : mA, I = st.blown ? 0 : b.iOut();
          return { label: w ? 'Caudal' : 'Corriente', rated: f(st.fuse), now: f(I), over: I > st.fuse,
            f: st.blown ? 1 : fh.f, burnt: st.blown, name: w ? 'Empuje' : 'Calor',
            val: st.blown ? (w ? 'cerró' : 'se fundió') : Math.round(100 * Math.min(1, fh.f)) + ' %', end: w ? 'cierra' : 'se funde' };
        } },
        { actions: [{ text: side === 'w' ? 'Abrir la válvula' : 'Poner un fusible nuevo', hidden: () => !st.blown, onClick: repair }] }
      ]
    })
  });
  // La punta roja empieza más arriba en el tubo de la izquierda, para no taparle el nombre a la válvula.
  b.st.clamps.a[0] = [b.gw.X0, b.gw.TOP + 0.4 * (b.gw.BOT - b.gw.TOP)];
  b.start();
})();
</script>
</body>
