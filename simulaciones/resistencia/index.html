<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Resistencia · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261019185500">
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Resistencia</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua con bomba, manómetro, tramo angosto ajustable y medidor de caudal"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico con fuente, voltímetro, resistencia ajustable y amperímetro"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261019185500"></script>
<script src="../../assets/banco.js?v=20261019185500"></script>
<script>
(() => {
  const { C, draw: D, fmt } = Sim;
  // 0 Ω es un cortocircuito: solo la resistencia interna de la fuente (y de la bomba) limita la corriente.
  const RLIST = [0, 470, 680, 1000, 1500, 2200, 3300, 4700, 6800, 10000];   // ohmios
  const RINT = 15, IFUSE = 100;          // resistencia interna de la fuente; el fusible aguanta 100 mA
  const ohm = R => R >= 1000 ? (R / 1000).toLocaleString('es-MX') + ' kΩ' : R + ' Ω';
  const st = { ri: 3, bridge: false, blown: false, heat: 0, peak: 0, breakT: 9, sparks: [] };
  const sides = {};
  const Reff = () => st.bridge ? 0 : RLIST[st.ri];
  const profile = g => Sim.narrowProfile((g.BOT - g.TOP) + (g.PX - g.X0), Sim.narrowHalf(RLIST[st.ri]));
  // Puente: un tramo que sube y salta la resistencia. El fusible va en el cable de abajo, a la izquierda.
  const BX = 64, BH = 54;
  const bridgePath = g => [[g.X0, g.BOT], [g.X0, g.TOP], [g.PX - BX, g.TOP], [g.PX - BX, g.TOP - BH], [g.PX + BX, g.TOP - BH],
    [g.PX + BX, g.TOP], [g.X1, g.TOP], [g.X1, g.BOT], [g.X0, g.BOT]];
  const fuseAt = g => [(g.X0 + g.PX - b.SRC) / 2, g.BOT];

  const b = Sim.bench({
    iFull: 30,
    v0: 9,
    layout(g) {
      const s = sides[g.side] = { phase: 0, g, bridge: bridgePath(g) };
      if (g.side === 'w') { s.water = Sim.water(g.loop, profile(g)); s.waterB = Sim.water(s.bridge); }
    },
    model: V => ({ I: st.blown ? 0 : V / (Reff() + RINT) * 1000 }),
    // Voltaje en las terminales: la fuente pierde I·RINT por dentro, así que en cortocircuito se cae casi a 0.
    circuit(g, m, V) {
      const Vt = Math.max(0, V - m.I * RINT / 1000), fuse = { at: fuseAt(g), half: 24, dV: st.blown ? Vt : 0 };
      if (!st.bridge) return [{ pts: b.loopPts(g), I: m.I, v0: Vt, comps: [fuse, { at: [g.PX, g.TOP], half: 46, dV: st.blown ? 0 : Vt }] }];
      return [
        { pts: [[g.PX - b.SRC, g.BOT], [g.X0, g.BOT], [g.X0, g.TOP], [g.PX - BX, g.TOP]], I: m.I, v0: Vt, comps: [fuse] },
        { pts: [[g.PX - BX, g.TOP], [g.PX - BX, g.TOP - BH], [g.PX + BX, g.TOP - BH], [g.PX + BX, g.TOP]], I: m.I, v0: st.blown ? 0 : Vt, comps: [] },
        { pts: [[g.PX - BX, g.TOP], [g.PX + BX, g.TOP]], I: 0, v0: st.blown ? 0 : Vt, comps: [{ at: [g.PX, g.TOP], half: 46, dV: 0 }] },
        { pts: [[g.PX + BX, g.TOP], [g.X1, g.TOP], [g.X1, g.BOT], [g.PX + b.SRC, g.BOT]], I: m.I, v0: 0, comps: [] }
      ];
    },
    step(dt, m) {
      // Arriba de 100 mA el fusible se calienta y se funde cuando pasa el tiempo de la inercia.
      const T = b.st.tau;
      if (m.I > IFUSE && !st.blown) {
        st.peak = Math.max(st.peak, m.I);
        st.heat += T > 0 ? dt / T : 1;
        if (st.heat >= 1) blow();
      } else st.heat = Math.max(0, st.heat - dt / Math.max(T, 0.3));
      st.breakT += dt;
      for (const p of st.sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
      const r = Math.min(m.I, 60) * 6;   // las partículas tienen un tope de rapidez para que se puedan ver
      (st.bridge ? sides.w.waterB : sides.w.water).step(r, dt);
      sides.e.phase += r * dt;
    },
    drawW(ctx, g, m) {
      const s = sides.w;
      D.pipe(ctx, g.loop);
      D.narrow(ctx, g.PX, g.TOP, Sim.narrowHalf(RLIST[st.ri]));
      if (st.bridge) D.pipe(ctx, s.bridge.slice(2, 6));
      (st.bridge ? s.waterB : s.water).draw(ctx);
      fuse(ctx, g, true);
      label(ctx, g, RLIST[st.ri] ? 'tramo angosto' : 'sin estrechamiento', !RLIST[st.ri]);
      hint(ctx, g);
    },
    drawE(ctx, g, m) {
      const s = sides.e, path = st.bridge ? s.bridge : g.loop;
      D.wire(ctx, g.loop);
      if (st.bridge) D.wire(ctx, s.bridge.slice(2, 6));
      hot(ctx, path, m);
      D.flow(ctx, path, s.phase, C.charge, { gap: 30, r: 4.5 });
      D.resistor(ctx, g.PX, g.TOP);
      fuse(ctx, g, false);
      label(ctx, g, ohm(RLIST[st.ri]), !RLIST[st.ri], true);
      hint(ctx, g);
    }
  });
  function label(ctx, g, t, danger, mono) {
    const y = st.bridge ? g.TOP + 36 : g.TOP - 36;
    D.text(ctx, t, g.PX, y, danger ? C.danger : mono ? C.ink : C.muted, mono ? { size: 16, font: Sim.MONO, weight: 500 } : { size: 15 });
  }
  function hint(ctx, g) {
    let t, col = C.danger;
    if (st.blown) t = `Se fundió el fusible: pasaron ${fmt(st.peak, 0)} mA y aguanta ${IFUSE} mA`;
    else if (st.bridge || !RLIST[st.ri]) t = `¡Cortocircuito! Solo la resistencia interna limita la corriente`;
    else { t = g.side === 'w' ? 'Puentea el tramo angosto o quita el estrechamiento para ver un corto' : 'Puentea la resistencia o bájala a 0 Ω para ver un cortocircuito'; col = C.muted; }
    D.text(ctx, t, Sim.compact ? g.PX : g.PX - 60, 62, col, { size: Sim.compact ? 11 : 13, weight: col === C.danger ? 700 : 400 });
  }
  // Cables al rojo: brillan más cuanto más se pasa la corriente de lo que aguanta el fusible.
  function hot(ctx, path, m) {
    const k = Math.max(st.heat, Math.min(1, Math.max(0, (m.I - IFUSE) / (2 * IFUSE))));
    if (!k) return;
    ctx.globalAlpha = 0.35 * k; D.line(ctx, path, 16, '#ff5a1f'); ctx.globalAlpha = 1;
    D.line(ctx, path, 4, `rgba(255, ${Math.round(110 - 60 * k)}, 30, ${0.4 + 0.6 * k})`);
  }
  // Fusible: cajita con un hilo; al calentarse brilla y tiembla, y al fundirse el hilo se corta con chispas.
  function fuse(ctx, g, water) {
    const [x0, y] = fuseAt(g), t = performance.now() / 1000;
    const x = x0 + (st.heat && !st.blown ? 2 * st.heat * Math.sin(t * 50) : 0);
    if (st.heat > 0 && !st.blown) {
      const gr = ctx.createRadialGradient(x, y, 3, x, y, 46);
      gr.addColorStop(0, `rgba(255, 120, 40, ${0.8 * st.heat})`); gr.addColorStop(1, 'rgba(255, 120, 40, 0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 46, 0, Math.PI * 2); ctx.fill();
    }
    const h = water ? 15 : 11;
    D.roundRect(ctx, x - 24, y - h, 48, 2 * h, 6, C.card, st.blown ? C.danger : C.ink, 2.5);
    ctx.lineWidth = 2.5; ctx.strokeStyle = st.heat > 0.3 && !st.blown ? '#ff7a1f' : C.ink;
    if (st.blown) { D.line(ctx, [[x - 24, y], [x - 7, y - 3]], 2.5, C.ink); D.line(ctx, [[x + 7, y + 3], [x + 24, y]], 2.5, C.ink); }
    else D.line(ctx, [[x - 24, y], [x + 24, y]], 2.5, ctx.strokeStyle);
    D.text(ctx, st.blown ? 'fusible fundido' : 'fusible', x, y + h + 18, st.blown ? C.danger : C.muted, { size: 14 });
    if (st.breakT < 1.2) {
      ctx.globalAlpha = Math.min(1, (1.2 - st.breakT) / 0.4);
      if (st.breakT < 0.15) D.circle(ctx, x, y, 30, `rgba(255, 230, 150, ${1 - st.breakT / 0.15})`);
      for (const p of st.sparks) D.circle(ctx, x + p.x, y + p.y, 2.5, st.breakT < 0.5 ? '#ffd23c' : '#ff7a2a');
      for (let k = 0; k < 3; k++) {
        const u = Math.max(0, st.breakT - k * 0.15);
        D.circle(ctx, x + (k - 1) * 8, y - 10 - 45 * u, 5 + 14 * u, `rgba(120, 120, 120, ${0.4 * Math.max(0, 1 - u / 1.2)})`);
      }
      ctx.globalAlpha = 1;
    }
  }
  function blow() {
    st.blown = true; st.heat = 0; st.breakT = 0;
    st.sparks = Array.from({ length: 16 }, () => {
      const a = Math.random() * Math.PI * 2, v = 80 + 160 * Math.random();
      return { x: 0, y: 0, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 };
    });
    b.refresh();
  }

  b.linkedKnob({
    pos: g => [g.PX, g.TOP + 0.55 * (g.BOT - g.TOP)], min: 0, max: RLIST.length - 1, step: 1, value: st.ri, ticks: RLIST.length - 1,
    label: side => side === 'w' ? 'Estrechamiento de la tubería' : 'Resistencia',
    format: (v, side) => side === 'w' ? (v ? 'nivel ' + v + ' de ' + (RLIST.length - 1) : 'sin estrechamiento') : (v ? ohm(RLIST[v]) : '0 Ω, cortocircuito'),
    scale: side => side === 'w' ? [['sin', 0], ['angosto', 1]] : [['0 Ω', 0], ['10 kΩ', 1]],
    caption: side => side === 'w' ? 'estrechamiento' : 'resistencia',
    onInput: v => { st.ri = v; sides.w.water.setProfile(profile(sides.w.g)); }
  });
  b.linkedButton({
    pos: g => [g.PX, g.TOP + 0.24 * (g.BOT - g.TOP)],
    text: side => st.bridge ? 'Quitar el puente' : (side === 'w' ? 'Puentear el tramo' : 'Puentear la resistencia'),
    onClick: () => { st.bridge = !st.bridge; }
  });
  // Tocar el fusible (o el botón) pone uno nuevo.
  const repair = () => { st.blown = false; st.peak = 0; st.heat = 0; st.breakT = 9; };
  b.linkedButton({
    cls: 'sim-hit', pos: g => fuseAt(g), hidden: () => !st.blown,
    label: () => 'Poner un fusible nuevo', onClick: repair
  });
  b.linkedButton({
    pos: g => [fuseAt(g)[0], g.BOT - 46], hidden: () => !st.blown,
    text: () => 'Fusible nuevo', onClick: repair
  });
  b.start();
})();
</script>
</body>
</html>
