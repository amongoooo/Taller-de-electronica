<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interruptor y LED · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261021150000">
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Interruptor y LED</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua con válvula, tramo angosto ajustable y rueda con compuerta de un solo sentido"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico con interruptor, resistencia ajustable y LED"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261021150000"></script>
<script src="../../assets/banco.js?v=20261021150000"></script>
<script>
(() => {
  const { C, draw: D, fmt } = Sim;
  // La resistencia del LED se cambia pellizcando el tramo angosto o tocándolo (abre su menú): valores
  // comunes de 100 Ω a 1 kΩ, y abierto del todo es 0 Ω.
  const RMIN = 100, RMAX = 1000, HMIN = 3, HMAX = Sim.PIPE - 3, LN = Math.log(RMAX / RMIN);
  const RVALUES = [0, ...Sim.series(RMIN, RMAX)];
  // El LED necesita un voltaje según su color (unos 2 V el rojo, ver Sim.LEDS) y se quema arriba de 30 mA.
  const IMAX = 30, LED_K = 5.8, vf = () => Sim.led(st.led).vf;
  const XV = 270, XL = 545;              // válvula (interruptor) y LED; la resistencia va al centro
  const st = { closed: true, R: 470, led: 'rojo', rev: false, broken: false, ang: 0, om: 0, heat: 0, breakT: 9, debris: [], sparks: [] };
  const sides = {};
  const ohm = R => R >= 1000 ? (R / 1000).toLocaleString('es-MX') + ' kΩ' : R + ' Ω';
  const half = R => R ? HMAX - (HMAX - HMIN) * Math.log(R / RMIN) / LN : Sim.PIPE;
  const fromHalf = h => h >= Sim.PIPE - 0.5 ? 0 : Sim.nearest(RVALUES, RMIN * Math.exp((HMAX - Math.max(HMIN, Math.min(HMAX, h))) / (HMAX - HMIN) * LN));
  const profile = g => Sim.narrowProfile((g.BOT - g.TOP) + (g.PX - g.X0), half(st.R));

  const b = Sim.bench({
    iFull: 30, v0: 9,
    layout(g) {
      const s = sides[g.side] = { g, phase: 0 };
      if (g.side === 'w') s.water = Sim.water(g.loop, profile(g));
    },
    model(V) {
      const R = st.R;
      return { I: (st.closed && !st.rev && !st.broken) ? Math.max(0, V - vf()) / (R + 5) * 1000 : 0 };
    },
    // Si no pasa corriente, todo el voltaje queda en el interruptor abierto o en el LED que la bloquea.
    circuit(g, m, V) {
      const R = st.R, dR = m.I * R / 1000;
      const comps = [
        { at: [XV, g.TOP], half: 28, dV: st.closed ? 0 : V },
        { at: [XL, g.TOP], half: 30, dV: st.closed ? V - dR : 0 }
      ];
      if (R) comps.push({ at: [g.PX, g.TOP], half: 46, dV: dR });
      return [{ pts: b.loopPts(g), I: m.I, v0: V, comps }];
    },
    step(dt, m) {
      // Arriba de 30 mA la rueda (el LED) se calienta, aunque la inercia esté en 0: tarda en romperse,
      // y entre más se pasa más rápido (como I²·t). Con 66 mA tarda 1,5 s y nunca menos de 0,4 s,
      // para que se vea; si la corriente baja antes, se enfría.
      const over = (m.I / IMAX) ** 2 - 1;
      if (over > 0 && !st.broken) {
        st.heat += dt * Math.min(2.5, over / LED_K);
        if (st.heat >= 1) breakIt();
      } else {
        st.heat = Math.max(0, st.heat - dt / 1.5);
      }
      st.breakT += dt;
      for (const d of st.debris) { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 700 * dt; d.a += d.spin * dt; }
      for (const p of st.sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
      sides.w.water.step(m.I * 6, dt);
      sides.e.phase += m.I * 6 * dt;
      st.om = st.broken ? 0 : -m.I * Sim.WHEEL_RPM_PER_MA / 60 * 2 * Math.PI;
      st.ang += st.om * dt;
    },
    drawW(ctx, g, m) {
      D.pipe(ctx, g.loop);
      if (st.R) D.narrow(ctx, g.PX, g.TOP, half(st.R));
      sides.w.water.draw(ctx);
      b.grips(ctx, g.PX, g.TOP, half(st.R) + 5, pinch);
      D.text(ctx, st.R ? 'tramo angosto' : 'sin estrechamiento', g.PX, g.TOP - half(st.R) - 35, st.R ? C.muted : C.danger, { size: 15 });
      D.valve(ctx, XV, g.TOP, st.closed);
      const [jx, jy] = shake();
      if (st.heat > 0) glow(ctx, XL, g.TOP, 255, 60, 30, 46, st.heat);
      D.wheel(ctx, XL + jx, g.TOP + jy, { angle: st.ang, omega: st.om, broken: st.broken, rev: st.rev, label: 'rueda', tint: `rgb(${Sim.led(st.led).rgb})` });
      drawBreak(ctx, g, true);
    },
    drawE(ctx, g, m) {
      D.wire(ctx, g.loop);
      D.flow(ctx, g.loop, sides.e.phase, C.charge, { gap: 30, r: 4.5 });
      if (st.R) {
        D.resistor(ctx, g.PX, g.TOP);
        D.text(ctx, ohm(st.R), g.PX, g.TOP - half(st.R) - 35, C.ink, { size: 16, font: Sim.MONO, weight: 500 });
      } else D.text(ctx, 'sin resistencia', g.PX, g.TOP - half(st.R) - 35, C.danger, { size: 15 });
      b.grips(ctx, g.PX, g.TOP, half(st.R) + 5, pinch);
      D.knifeSwitch(ctx, XV, g.TOP, st.closed);
      const [jx, jy] = shake();
      if (st.heat > 0) glow(ctx, XL, g.TOP, 255, 230, 140, 56, st.heat);
      D.ledSymbol(ctx, XL + jx, g.TOP + jy, { I: m.I, broken: st.broken, rev: st.rev, rgb: Sim.led(st.led).rgb });
      drawBreak(ctx, g, false);
    }
  });

  // Mientras se calienta, la rueda (el LED) brilla y tiembla cada vez más.
  const shake = () => {
    if (!st.heat || st.broken) return [0, 0];
    const t = performance.now() / 1000, a = 2.5 * st.heat;
    return [a * Math.sin(t * 53), a * Math.cos(t * 47)];
  };
  function glow(ctx, x, y, r, gc, bc, rad, k) {
    const gr = ctx.createRadialGradient(x, y, 4, x, y, rad);
    gr.addColorStop(0, `rgba(${r}, ${gc}, ${bc}, ${0.85 * k})`); gr.addColorStop(1, `rgba(${r}, ${gc}, ${bc}, 0)`);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  }
  // Al romperse, las aspas salen volando (agua) y el LED suelta chispas y humo (electricidad).
  function breakIt() {
    st.broken = true; st.heat = 0; st.breakT = 0; b.halt();
    st.debris = [0, 1, 2, 3].map(k => {
      const a = st.ang + k * Math.PI / 2, v = 160 + 90 * Math.random();
      return { x: Math.cos(a) * 10, y: Math.sin(a) * 10, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140, a, spin: (Math.random() - 0.5) * 30 };
    });
    st.sparks = Array.from({ length: 16 }, () => {
      const a = Math.random() * Math.PI * 2, v = 80 + 160 * Math.random();
      return { x: 0, y: 0, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 };
    });
    b.refresh();
  }
  function drawBreak(ctx, g, water) {
    const t = st.breakT, T = 1.4;
    if (t >= T) return;
    const x0 = XL, y0 = g.TOP;
    ctx.globalAlpha = Math.min(1, (T - t) / 0.4);
    if (water) {
      // flash al romperse y las cuatro aspas girando mientras caen
      if (t < 0.15) glow(ctx, x0, y0, 255, 200, 120, 60, 1 - t / 0.15);
      ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.lineCap = 'round';
      for (const d of st.debris) {
        const x = x0 + d.x, y = y0 + d.y;
        ctx.beginPath(); ctx.moveTo(x - Math.cos(d.a) * 9, y - Math.sin(d.a) * 9); ctx.lineTo(x + Math.cos(d.a) * 9, y + Math.sin(d.a) * 9); ctx.stroke();
      }
    } else {
      if (t < 0.15) glow(ctx, x0, y0, 255, 240, 180, 70, 1 - t / 0.15);
      for (let k = 0; k < 3; k++) {   // humo que sube y se agranda
        const u = Math.max(0, t - k * 0.15);
        D.circle(ctx, x0 + (k - 1) * 8, y0 - 10 - 50 * u, 6 + 18 * u, `rgba(120, 120, 120, ${0.45 * Math.max(0, 1 - u / T)})`);
      }
      for (const p of st.sparks) D.circle(ctx, x0 + p.x, y0 + p.y, 2.5, t < 0.6 ? '#ffd23c' : '#ff7a2a');
    }
    ctx.globalAlpha = 1;
  }

  b.linkedButton({
    cls: 'sim-hit', pos: g => [XV, g.TOP],
    label: side => (st.closed ? (side === 'w' ? 'Cerrar la válvula' : 'Abrir el interruptor') : (side === 'w' ? 'Abrir la válvula' : 'Cerrar el interruptor')),
    onClick: () => { st.closed = !st.closed; }
  });
  b.linkedButton({
    pos: g => [XL, g.TOP + 88],
    text: side => side === 'w' ? 'Girar la rueda' : 'Girar el LED',
    onClick: () => { st.rev = !st.rev; }
  });
  // Tocar la rueda (o el LED) abre su menú: su color, girarlo y romperlo o poner uno nuevo.
  b.part({
    pos: g => [XL, g.TOP],
    label: side => side === 'w' ? 'Rueda' : 'LED',
    menu: Sim.ledMenu({
      get: () => st.led, set: id => { st.led = id; },
      actions: side => [
        { text: side === 'w' ? 'Girar la rueda' : 'Girar el LED', onClick: () => { st.rev = !st.rev; } },
        { text: () => st.broken ? (side === 'w' ? 'Poner una rueda nueva' : 'Poner un LED nuevo') : (side === 'w' ? 'Romper la rueda' : 'Fundir el LED'),
          danger: true, onClick: () => { if (st.broken) { st.broken = false; st.heat = 0; st.breakT = 9; } else breakIt(); } }
      ]
    })
  });
  const setR = R => { st.R = R; sides.w.water.setProfile(profile(sides.w.g)); };
  const pinch = b.pinch({
    pos: g => [g.PX, g.TOP], get: () => st.R, half, fromHalf, set: setR,
    label: side => side === 'w' ? 'Tramo angosto' : 'Resistencia del LED',
    text: R => R ? ohm(R) : 'sin resistencia',
    menu: Sim.resistorMenu({ values: RVALUES, get: () => st.R, set: setR, format: R => R ? ohm(R) : '0 Ω (sin resistencia)' })
  });
  b.start();
})();
</script>
</body>
</html>
