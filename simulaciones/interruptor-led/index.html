<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interruptor y LED · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261025073237">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Interruptor y LED</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua con válvula, tramo angosto ajustable y rueda con compuerta de un solo sentido"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico con interruptor, resistencia ajustable y LED"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261025073237"></script>
<script src="../../assets/banco.js?v=20261025073237"></script>
<script>
(() => {
  const { C, draw: D, fmt } = Sim;
  // La resistencia del LED se cambia pellizcando el tramo angosto o tocándolo (abre su menú): valores
  // comunes de 100 Ω a 1 kΩ, y abierto del todo es 0 Ω.
  const RMIN = 100, RMAX = 1000, HMIN = 3, HMAX = Sim.PIPE - 3, LN = Math.log(RMAX / RMIN);
  const RVALUES = [0, ...Sim.series(RMIN, RMAX)];
  // El LED necesita un voltaje según su color (unos 2 V el rojo, ver Sim.LEDS) y se quema arriba de 30 mA.
  // Los dos se calientan (Sim.heat) y su menú lo muestra: el LED aguanta Vf · 30 mA, la resistencia ¼ W.
  const IMAX = Sim.LED_IMAX, vf = () => Sim.led(st.led).vf;
  const lh = Sim.heat({ ...Sim.HEAT.led, pMax: () => vf() * IMAX / 1000 }), rh = Sim.heat(Sim.HEAT.res);
  const XV = 270, XL = 545;              // válvula (interruptor) y LED; la resistencia va al centro
  const st = { closed: true, R: 470, led: 'rojo', rev: false, broken: false, rburnt: false, burnT: 9, ang: 0, om: 0, breakT: 9, debris: [], sparks: [] };
  const sides = {};
  const ohm = Sim.ohm;
  const half = R => R ? HMAX - (HMAX - HMIN) * Math.log(R / RMIN) / LN : Sim.PIPE;
  const fromHalf = h => h >= Sim.PIPE - 0.5 ? 0 : Sim.nearest(RVALUES, RMIN * Math.exp((HMAX - Math.max(HMIN, Math.min(HMAX, h))) / (HMAX - HMIN) * LN));
  const profile = g => Sim.narrowProfile((g.BOT - g.TOP) + (g.PX - g.X0), half(st.R));

  const b = Sim.bench({
    iFull: 30, v0: 9,
    layout(g) {
      const s = sides[g.side] = { g, phase: 0 };
      if (g.side === 'w') s.water = Sim.water(g.loop, profile(g));
    },
    model(V) {
      const R = st.R;
      // el LED solo deja pasar en su sentido: al revés (st.rev) conduce si la fuente también está invertida (V < 0)
      const fwd = st.rev ? -V : V;
      return { I: (st.closed && !st.broken && !st.rburnt) ? Math.sign(V) * Math.max(0, fwd - vf()) / (R + 5) * 1000 : 0 };
    },
    // Si no pasa corriente, todo el voltaje queda en el interruptor abierto o en el LED que la bloquea.
    circuit(g, m, V) {
      const R = st.R, dR = st.rburnt ? (st.closed ? V : 0) : m.I * R / 1000;
      // draw y tag: cómo se ve cada uno en la vista de nodos (en su lugar de siempre; el banco lo mueve)
      const comps = [
        { at: [XV, g.TOP], half: 28, dV: st.closed ? 0 : V, R: st.closed ? 0 : Infinity, ext: w => w ? 46 : 30,
          draw: (ctx, w) => w ? D.valve(ctx, XV, g.TOP, st.closed) : D.knifeSwitch(ctx, XV, g.TOP, st.closed),
          tag: w => switchTag(w) },
        { at: [XL, g.TOP], half: 30, dV: st.closed ? V - dR : 0, pr: ledPart, ext: w => w ? 46 : 28,
          draw: (ctx, w) => {
            const [jx, jy] = shake();
            if (w) D.wheel(ctx, XL + jx, g.TOP + jy, { angle: st.ang, omega: st.om, broken: st.broken, rev: st.rev, tint: `rgb(${Sim.led(st.led).rgb})` });
            else D.ledSymbol(ctx, XL + jx, g.TOP + jy, { I: Math.abs(m.I), broken: st.broken, rev: st.rev, rgb: Sim.led(st.led).rgb });
          },
          tag: w => ledTag(w) }
      ];
      if (R) comps.push({ at: [g.PX, g.TOP], half: 46, dV: dR, R: st.rburnt ? Infinity : R, pr: pinch,
        draw: (ctx, w) => w ? D.narrow(ctx, g.PX, g.TOP, half(R)) : D.resistor(ctx, g.PX, g.TOP),
        tag: w => [w ? 'tramo angosto' : 'resistencia', ohm(R), st.rburnt, st.rburnt ? (w ? 'reventado' : 'quemada') : ''] });
      return [{ pts: b.loopPts(g), I: m.I, v0: V, comps }];
    },
    step(dt, m) {
      // El LED (la rueda) se calienta con su potencia Vf · I, aunque la inercia esté en 0: arriba de 30 mA
      // se pasa de lo que aguanta y se quema, más rápido entre más se pasa (con 66 mA, en 1,5 s); si la
      // corriente baja antes, se enfría. La resistencia igual, con I²·R arriba de ¼ W.
      if (lh.step(st.broken ? 0 : vf() * Math.abs(m.I) / 1000, dt) && !st.broken) breakIt();
      if (rh.step(st.rburnt ? 0 : (m.I / 1000) ** 2 * st.R, dt) && !st.rburnt) burnR();
      st.burnT += dt;
      st.breakT += dt;
      for (const d of st.debris) { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 700 * dt; d.a += d.spin * dt; }
      for (const p of st.sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
      const I = b.flowI(m);   // con un multímetro en A haciendo un corto, la que de verdad da la fuente
      sides.w.water.step(I * 6, dt);
      sides.e.phase += I * 6 * dt;
      st.om = st.broken ? 0 : -m.I * Sim.WHEEL_RPM_PER_MA / 60 * 2 * Math.PI;
      st.ang += st.om * dt;
    },
    drawW(ctx, g, m) {
      D.pipe(ctx, g.loop);
      if (st.R) D.narrow(ctx, g.PX, g.TOP, half(st.R));
      sides.w.water.draw(ctx);
      if (st.R) D.burstPipe(ctx, g.PX, g.TOP, half(st.R), st.burnT, st.rburnt, rh.glow, '');
      b.grips(ctx, g.PX, g.TOP, half(st.R) + 5, pinch);
      D.valve(ctx, XV, g.TOP, st.closed, false);
      const [jx, jy] = shake();
      if (lh.glow > 0 && !st.broken) glow(ctx, XL, g.TOP, 255, 60, 30, 46, lh.glow);
      D.wheel(ctx, XL + jx, g.TOP + jy, { angle: st.ang, omega: st.om, broken: st.broken, rev: st.rev, tint: `rgb(${Sim.led(st.led).rgb})`, tag: false });
      tags(ctx, g, true);
      drawBreak(ctx, g, true);
    },
    drawE(ctx, g, m) {
      D.wire(ctx, g.loop);
      D.flow(ctx, g.loop, sides.e.phase, C.charge, { gap: 30, r: 4.5 });
      if (st.R) {
        if (!st.rburnt) D.heatGlow(ctx, g.PX, g.TOP, rh.glow);
        D.resistor(ctx, g.PX, g.TOP);
        if (st.rburnt) D.burntResistor(ctx, g.PX, g.TOP, st.burnT, '');
      }
      b.grips(ctx, g.PX, g.TOP, half(st.R) + 5, pinch);
      D.knifeSwitch(ctx, XV, g.TOP, st.closed, false);
      const [jx, jy] = shake();
      if (lh.glow > 0 && !st.broken) glow(ctx, XL, g.TOP, 255, 230, 140, 56, lh.glow);
      D.ledSymbol(ctx, XL + jx, g.TOP + jy, { I: Math.abs(m.I), broken: st.broken, rev: st.rev, rgb: Sim.led(st.led).rgb, tag: false });
      tags(ctx, g, false);
      drawBreak(ctx, g, false);
    }
  });

  // Etiquetas en una línea arriba de cada componente («nombre valor» y su estado en una pastilla), todas a
  // la misma altura: en el agua más arriba, sobre la manija de la válvula, la flecha de la rueda y su contorno.
  const switchTag = w => [w ? 'válvula' : 'interruptor', '', !st.closed, w ? (st.closed ? 'abierta' : 'cerrada') : (st.closed ? 'cerrado' : 'abierto')];
  const ledTag = w => [w ? 'rueda' : 'LED', w ? st.led.replace(/o$/, 'a') : st.led, st.broken || st.rev,
    st.broken ? (w ? 'rota' : 'quemado') : st.rev ? (w ? 'compuerta cerrada' : 'al revés') : ''];
  const rTag = w => st.R ? [w ? 'tramo angosto' : 'resistencia', ohm(st.R), st.rburnt, st.rburnt ? (w ? 'reventado' : 'quemada') : '']
    : [w ? 'sin estrechamiento' : 'sin resistencia', '0 Ω', true];
  const SHORT = { 'tramo angosto': 'tramo', 'resistencia': 'R', 'interruptor': 'interr.', 'sin estrechamiento': 'sin tramo', 'sin resistencia': 'sin R' };
  function tags(ctx, g, w) {
    b.tagRow(ctx, g, g.TOP - (w ? 68 : 44), [[switchTag(w), XV, null], [rTag(w), g.PX, pinch], [ledTag(w), XL, ledPart]]
      .map(([t, x, pr]) => ({ x, pr, name: SHORT[t[0]] ? [t[0], SHORT[t[0]]] : t[0], value: t[1], danger: t[2], state: t[3] })));
  }
  // Mientras se calienta, la rueda (el LED) brilla y tiembla cada vez más.
  const shake = () => {
    if (!lh.glow || st.broken) return [0, 0];
    const t = performance.now() / 1000, a = 2.5 * lh.glow;
    return [a * Math.sin(t * 53), a * Math.cos(t * 47)];
  };
  function glow(ctx, x, y, r, gc, bc, rad, k) {
    const gr = ctx.createRadialGradient(x, y, 4, x, y, rad);
    gr.addColorStop(0, `rgba(${r}, ${gc}, ${bc}, ${0.85 * k})`); gr.addColorStop(1, `rgba(${r}, ${gc}, ${bc}, 0)`);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  }
  // Al romperse, las aspas salen volando (agua) y el LED suelta chispas y humo (electricidad).
  function breakIt() {
    st.broken = true; st.breakT = 0; b.halt();
    st.debris = [0, 1, 2, 3].map(k => {
      const a = st.ang + k * Math.PI / 2, v = 160 + 90 * Math.random();
      return { x: Math.cos(a) * 10, y: Math.sin(a) * 10, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140, a, spin: (Math.random() - 0.5) * 30 };
    });
    st.sparks = Array.from({ length: 16 }, () => {
      const a = Math.random() * Math.PI * 2, v = 80 + 160 * Math.random();
      return { x: 0, y: 0, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 };
    });
    b.refresh();
  }
  // La resistencia quemada (el tramo reventado) abre el circuito.
  function burnR() { st.rburnt = true; st.burnT = 0; b.halt(); b.refresh(); }
  const renewR = () => { st.rburnt = false; rh.reset(); st.burnT = 9; };
  function drawBreak(ctx, g, water) {
    const t = st.breakT, T = 1.4;
    if (t >= T) return;
    const x0 = XL, y0 = g.TOP;
    ctx.globalAlpha = Math.min(1, (T - t) / 0.4);
    if (water) {
      // flash al romperse y las cuatro aspas girando mientras caen
      if (t < 0.15) glow(ctx, x0, y0, 255, 200, 120, 60, 1 - t / 0.15);
      ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.lineCap = 'round';
      for (const d of st.debris) {
        const x = x0 + d.x, y = y0 + d.y;
        ctx.beginPath(); ctx.moveTo(x - Math.cos(d.a) * 9, y - Math.sin(d.a) * 9); ctx.lineTo(x + Math.cos(d.a) * 9, y + Math.sin(d.a) * 9); ctx.stroke();
      }
    } else {
      if (t < 0.15) glow(ctx, x0, y0, 255, 240, 180, 70, 1 - t / 0.15);
      for (let k = 0; k < 3; k++) {   // humo que sube y se agranda
        const u = Math.max(0, t - k * 0.15);
        D.circle(ctx, x0 + (k - 1) * 8, y0 - 10 - 50 * u, 6 + 18 * u, `rgba(120, 120, 120, ${0.45 * Math.max(0, 1 - u / T)})`);
      }
      for (const p of st.sparks) D.circle(ctx, x0 + p.x, y0 + p.y, 2.5, t < 0.6 ? '#ffd23c' : '#ff7a2a');
    }
    ctx.globalAlpha = 1;
  }

  b.linkedButton({
    cls: 'sim-hit', pos: g => [XV, g.TOP],
    label: side => (st.closed ? (side === 'w' ? 'Cerrar la válvula' : 'Abrir el interruptor') : (side === 'w' ? 'Abrir la válvula' : 'Cerrar el interruptor')),
    onClick: () => { st.closed = !st.closed; }
  });
  // Tocar la rueda (o el LED) abre su menú: su color, girarlo y romperlo o poner uno nuevo.
  const ledPart = b.part({
    pos: g => [XL, g.TOP],
    label: side => side === 'w' ? 'Rueda' : 'LED',
    menu: Sim.ledMenu({
      get: () => st.led, set: id => { st.led = id; }, heat: lh, broken: () => st.broken,
      actions: side => [
        { text: side === 'w' ? 'Girar la rueda' : 'Girar el LED', onClick: () => { st.rev = !st.rev; } },
        { text: () => st.broken ? (side === 'w' ? 'Poner una rueda nueva' : 'Poner un LED nuevo') : (side === 'w' ? 'Romper la rueda' : 'Fundir el LED'),
          danger: true, onClick: () => { if (st.broken) { st.broken = false; lh.reset(); st.breakT = 9; } else breakIt(); } }
      ]
    })
  });
  const setR = R => { st.R = R; if (!R) renewR(); sides.w.water.setProfile(profile(sides.w.g)); };   // sin resistencia no hay nada quemado
  const pinch = b.pinch({
    pos: g => [g.PX, g.TOP], get: () => st.R, half, fromHalf, set: setR,
    label: side => side === 'w' ? 'Tramo angosto' : 'Resistencia del LED',
    text: R => R ? ohm(R) : 'sin resistencia',
    menu: Sim.resistorMenu({ values: RVALUES, get: () => st.R, set: setR, format: R => R ? ohm(R) : '0 Ω (sin resistencia)',
      heat: rh, broken: () => st.rburnt,
      actions: side => [{ text: side === 'w' ? 'Poner un tubo nuevo' : 'Poner una resistencia nueva', hidden: () => !st.rburnt, onClick: renewR }] })
  });
  b.start();
})();
</script>
</body>
</html>
