<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cómo medir · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261024070502">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Cómo medir</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua con bomba y dos tramos angostos en serie, que se transforma en nodos; medidor de agua con perilla (presión, caudal, resistencia)"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico con fuente y dos resistencias en serie, que se transforma en nodos; multímetro con perilla (V, A, Ω)"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261024070502"></script>
<script src="../../assets/banco.js?v=20261024070502"></script>
<script>
(() => {
  const { C, draw: D } = Sim;
  // Fuente de 9 V con dos resistencias en serie: R1 de 1 kΩ y R2 de 2 kΩ. Quedan tres nodos: 9 V,
  // 6 V y la tierra (0 V), y pasan 3 mA. Por pasos: los cables se juntan en nodos, luego se mide el
  // voltaje con el multímetro en V (comparar dos nodos), la corriente en A (abrir el camino y meterlo en
  // serie), la resistencia en Ω (con la fuente apagada) y al final un reto: medir las dos cosas.
  // Son de ½ W: con los 35 V de la fuente pasan 11,7 mA y R2 recibe 0,27 W, así que no se queman.
  const RS = [1000, 2000], XR = [300, 500];
  const hn = RS.map(R => Sim.narrowHalf(R));
  const sides = {};
  const ohm = Sim.ohm;
  const prof = g => Sim.profile(...[0, 1].map(k => Sim.narrowProfile((g.BOT - g.TOP) + (XR[k] - g.X0), hn[k])));

  const b = Sim.bench({
    iFull: 12, v0: 9,
    layout(g) {
      const s = sides[g.side] = { phase: 0 };
      if (g.side === 'w') s.water = Sim.water(g.loop, prof(g));
    },
    model: V => ({ I: V / (RS[0] + RS[1]) * 1000 }),
    circuit: (g, m, V) => [{ pts: b.loopPts(g), I: m.I, v0: V, comps: [0, 1].map(k => ({
      id: 'R' + (k + 1), at: [XR[k], g.TOP], half: 46, dV: m.I * RS[k] / 1000, R: RS[k],
      draw: (ctx, w) => w ? D.narrow(ctx, XR[k], g.TOP, hn[k]) : D.resistor(ctx, XR[k], g.TOP),
      tag: () => ['R' + (k + 1), ohm(RS[k])]
    })) }],
    step(dt, m) {
      const I = b.flowI(m);   // con un multímetro en A haciendo un corto, la que de verdad da la fuente
      sides.w.water.step(I * 12, dt);
      sides.e.phase += I * 12 * dt;
    },
    drawW(ctx, g) {
      D.pipe(ctx, g.loop);
      [0, 1].forEach(k => D.narrow(ctx, XR[k], g.TOP, hn[k]));
      sides.w.water.draw(ctx);
      [0, 1].forEach(k => b.tag(ctx, null, XR[k], g.TOP - 42, 'R' + (k + 1), ohm(RS[k])));
    },
    drawE(ctx, g) {
      D.wire(ctx, g.loop);
      D.flow(ctx, g.loop, sides.e.phase, C.charge, { gap: 30, r: 4.5 });
      [0, 1].forEach(k => { D.resistor(ctx, XR[k], g.TOP); b.tag(ctx, null, XR[k], g.TOP - 42, 'R' + (k + 1), ohm(RS[k])); });
    }
  });

  // La bomba y la fuente empiezan encendidas.
  document.querySelector('#pe .sim-power').click();
  b.start();

  // Al empezar, en el circuito normal, y al momento se transforma en nodos. El multímetro aparece al
  // medir voltaje (con la perilla en V); para la corriente y la resistencia hay que girar su perilla.
  // En el reto se miden las dos cosas.
  const STEPS = ['Los nodos', 'Medir voltaje', 'Medir corriente', 'Medir resistencia', 'Reto'];
  let timer = 0;
  Sim.steps(STEPS, k => {
    b.showMeters({ a: k > 0 });
    if (k === 1) b.setDial('a', 'V');
    if (k === 4 && !b.st.on) document.querySelector('#pe .sim-power').click();
    clearTimeout(timer);
    if (k === 0) { b.setNodes(false); timer = setTimeout(() => b.setNodes(true), 900); } else b.setNodes(true);
  }, k => {
    // Cada paso se cumple solo: los nodos ya formados; el multímetro en V entre dos nodos, en A abriendo un
    // cable o en Ω con la fuente apagada; en el reto, uno en V y el otro en A a la vez.
    if (k === 0) return !!b.net();
    const m = b.measuring();
    return k === 4 ? m.includes('V') && m.includes('A') : m.includes('VAR'[k - 1]);
  });
})();
</script>
</body>
</html>
