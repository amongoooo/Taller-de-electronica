<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cómo medir · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261021093837">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Cómo medir</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua con bomba y dos tramos angostos en serie, que se transforma en nodos; manómetro y medidor de caudal"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico con fuente y dos resistencias en serie, que se transforma en nodos; voltímetro y amperímetro"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
  <p class="sim-sr" id="aviso" aria-live="polite"></p>
</div>

<script src="../../assets/sim.js?v=20261021093837"></script>
<script src="../../assets/banco.js?v=20261021093837"></script>
<script>
(() => {
  const { C, draw: D, fmt } = Sim;
  // Fuente de 9 V con dos resistencias en serie: R1 de 1 kΩ y R2 de 2 kΩ. Quedan tres nodos: 9 V,
  // 6 V y la tierra (0 V), y pasan 3 mA. Por pasos: los cables se juntan en nodos, luego se mide el
  // voltaje (comparar dos nodos), luego la corriente (abrir el camino y meter el amperímetro en serie)
  // y al final un reto que avisa si se conectó bien.
  const RS = [1000, 2000], XR = [300, 500];
  const hn = RS.map(R => Sim.narrowHalf(R));
  const sides = {};
  const ohm = R => (R / 1000).toLocaleString('es-MX') + ' kΩ';
  const prof = g => Sim.profile(...[0, 1].map(k => Sim.narrowProfile((g.BOT - g.TOP) + (XR[k] - g.X0), hn[k])));
  let step = 0;

  const b = Sim.bench({
    iFull: 12, v0: 9,
    layout(g) {
      const s = sides[g.side] = { phase: 0 };
      if (g.side === 'w') s.water = Sim.water(g.loop, prof(g));
    },
    model: V => ({ I: V / (RS[0] + RS[1]) * 1000 }),
    circuit: (g, m, V) => [{ pts: b.loopPts(g), I: m.I, v0: V, comps: [0, 1].map(k => ({
      id: 'R' + (k + 1), at: [XR[k], g.TOP], half: 46, dV: m.I * RS[k] / 1000,
      draw: (ctx, w) => w ? D.narrow(ctx, XR[k], g.TOP, hn[k]) : D.resistor(ctx, XR[k], g.TOP),
      tag: () => ['R' + (k + 1), ohm(RS[k])]
    })) }],
    step(dt, m) {
      sides.w.water.step(m.I * 12, dt);
      sides.e.phase += m.I * 12 * dt;
    },
    drawW(ctx, g) {
      D.pipe(ctx, g.loop);
      [0, 1].forEach(k => D.narrow(ctx, XR[k], g.TOP, hn[k]));
      sides.w.water.draw(ctx);
      [0, 1].forEach(k => b.tag(ctx, null, XR[k], g.TOP - 42, 'R' + (k + 1), ohm(RS[k])));
    },
    drawE(ctx, g) {
      D.wire(ctx, g.loop);
      D.flow(ctx, g.loop, sides.e.phase, C.charge, { gap: 30, r: 4.5 });
      [0, 1].forEach(k => { D.resistor(ctx, XR[k], g.TOP); b.tag(ctx, null, XR[k], g.TOP - 42, 'R' + (k + 1), ohm(RS[k])); });
    },
    overlay: (ctx, g) => note(ctx, g)
  });

  // ---------- lo que dice arriba del circuito en cada paso ----------
  const V_ = w => w ? ' psi' : ' V';
  const val = (v, w) => fmt(Math.abs(v) < 0.005 ? 0 : v, 2) + V_(w);
  // Renglones del aviso: [texto, color] (el primero va en negritas). ok: true/false pone ✓ o ✗.
  const lines = w => {
    const at = b.where(), on = b.st.on && b.st.vo > 0.5;
    const nodes = b.nodesOn(), r = [];
    const meterV = w ? 'el manómetro' : 'el voltímetro', meterI = w ? 'el medidor de caudal' : 'el amperímetro';
    const tips = w ? 'mangueras' : 'puntas';
    if (step === 0) {
      r.push([nodes ? (w ? 'Cada nodo es una sola presión' : 'Cada nodo es un solo voltaje') : (w ? 'Las tuberías no gastan presión' : 'Los cables no gastan voltaje')]);
      r.push([nodes ? 'La tierra es 0' + V_(w) + '. Solo quedan los componentes entre los nodos.'
        : (w ? 'Todo lo unido por tubería tiene la misma presión: es un nodo.' : 'Todo lo unido por cable tiene el mismo voltaje: es un nodo.')]);
      if (!on) r.push(['Enciende la ' + (w ? 'bomba' : 'fuente') + ' para ver el valor de cada nodo.', C.muted]);
      return r;
    }
    if (!on) return [['Enciende la ' + (w ? 'bomba' : 'fuente')], ['Con ella apagada todo está en 0' + V_(w) + '.', C.muted]];
    if (step === 1) {
      r.push([(w ? 'La presión' : 'El voltaje') + ' se mide entre dos nodos']);
      const [A, B] = at.V;
      if (!A || !B) r.push([`Pon las dos ${tips} de ${meterV} en dos nodos.`, C.muted]);
      else if (A === B) r.push([`Las dos ${tips} en el mismo nodo: marca 0${V_(w)}, no hay diferencia.`, C.muted]);
      else r.push([`Roja en ${val(A.v, w)} − negra en ${val(B.v, w)} = ${val(A.v - B.v, w)}`, '#8b5cf6']);
      return r;
    }
    if (step === 2) {
      r.push([(w ? 'El caudal' : 'La corriente') + ' se mide abriendo el camino']);
      if (!at.I) r.push([`Abre un ${w ? 'tubo' : 'cable'} junto a un componente y mete ${meterI} en serie: todo pasa por él.`, C.muted]);
      else r.push([`En serie: pasa${w ? 'n' : ''} ${fmt(Math.abs(at.I.I), 2)}${w ? ' mL/s' : ' mA'} por ${meterI}`, '#0ea371']);
      if (nodes) r.push(['En un nodo no se puede: no hay camino que abrir.', C.muted]);
      return r;
    }
    // reto
    r.push(['Reto: mide ' + (w ? 'la presión' : 'el voltaje') + ' de R2 y ' + (w ? 'el caudal' : 'la corriente')]);
    const R2 = at.comps.find(c => c.c.id === 'R2'), [A, B] = at.V;
    let okV = false, msgV;
    if (!A || !B) msgV = `Pon las ${tips} de ${meterV}.`;
    else if (A === B) msgV = 'Las dos en el mismo nodo: marca 0.';
    else if ((A === R2.A && B === R2.B) || (A === R2.B && B === R2.A)) {
      okV = true;
      msgV = `R2: ${val(Math.abs(A.v - B.v), w)}` + (A.v < B.v ? ' (marca negativo: las ' + tips + ' van al revés)' : '');
    } else msgV = 'Esos dos nodos no son los de R2.';
    r.push([(okV ? '✓ ' : '✗ ') + msgV, okV ? C.ok : C.danger]);
    const okI = !!at.I;
    r.push([(okI ? '✓ ' : '✗ ') + (okI ? `${w ? 'Caudal' : 'Corriente'}: ${fmt(Math.abs(at.I.I), 2)}${w ? ' mL/s' : ' mA'}` : `Mete ${meterI} en serie.`), okI ? C.ok : C.danger]);
    if (okV && okI) r.push(['¡Muy bien! Así se mide en un circuito de verdad.', C.ink]);
    return r;
  };
  // Aviso centrado arriba del circuito, partido en renglones que caben.
  const wrap = (ctx, t, max) => {
    const out = [];
    let cur = '';
    for (const w of t.split(' ')) {
      const nx = cur ? cur + ' ' + w : w;
      if (cur && ctx.measureText(nx).width > max) { out.push(cur); cur = w; } else cur = nx;
    }
    if (cur) out.push(cur);
    return out;
  };
  const said = {};
  function note(ctx, g) {
    const w = g.side === 'w', ls = lines(w), k = Sim.compact ? 1.15 : 1, max = Math.min(560, g.W - 40);
    const rows = [];
    ls.forEach(([t, col], j) => {
      ctx.font = `${j ? 400 : 700} ${Math.round((j ? 15 : 17) * k)}px ${Sim.FONT}`;
      wrap(ctx, t, max).forEach(s => rows.push([s, col || C.ink, j]));
    });
    const lh = 21 * k, cx = g.VX + g.W / 2;
    let y = Math.max(46, g.TOP - 62 - (rows.length - 1) * lh);   // abajo de la escala de colores
    rows.forEach(([s, col, j]) => {
      D.text(ctx, s, cx, y, col, { size: j ? 15 : 17, weight: j ? 400 : 700 });
      y += lh;
    });
    b.labelTop[g.side] = y - lh / 2 + 4;   // las etiquetas de los nodos van abajo del aviso
    // para los lectores de pantalla, el aviso del lado que se ve
    const text = ls.map(l => l[0]).join('. ');
    if (g.side === (Sim.view === 'w' ? 'w' : 'e') && said.t !== text) { said.t = text; document.getElementById('aviso').textContent = text; }
  }

  // Un botón para ver otra vez cómo se juntan los cables (o separarlos).
  b.linkedButton({
    pos: g => [g.PX, (g.TOP + g.BOT) / 2 + 20], act: 'ver',
    text: side => b.nodesOn() ? (side === 'w' ? 'Separar las tuberías' : 'Separar los cables') : (side === 'w' ? 'Juntar las tuberías en nodos' : 'Juntar los cables en nodos'),
    onClick: () => b.setNodes(!b.nodesOn())
  });
  setInterval(() => b.refresh(), 400);

  // La bomba y la fuente empiezan encendidas.
  document.querySelector('#pe .sim-power').click();
  b.start();

  // Al empezar, en el circuito normal, y al momento se transforma en nodos. El voltímetro aparece al
  // medir voltaje, el amperímetro al medir corriente, y en el reto los dos.
  const STEPS = [
    ['Los nodos', { V: false, I: false }],
    ['Medir voltaje', { V: true, I: false }],
    ['Medir corriente', { V: false, I: true }],
    ['Reto', { V: true, I: true }]
  ];
  let timer = 0;
  Sim.steps(STEPS.map(s => s[0]), k => {
    step = k;
    b.showMeters(STEPS[k][1]);
    clearTimeout(timer);
    if (k === 0) { b.setNodes(false); timer = setTimeout(() => b.setNodes(true), 900); } else b.setNodes(true);
  });
})();
</script>
</body>
</html>
