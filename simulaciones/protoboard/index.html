<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Protoboard · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261026224540">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<style>
.sim-bar .ctl { gap: 8px; }
.pb-btn {
  font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px 12px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink);
}
.pb-btn[aria-pressed="true"] { border-color: var(--water); background: var(--water-soft); color: var(--water); }
@media (max-width: 600px) { .pb-btn { font-size: 13px; padding: 4px 9px; } }
</style>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Protoboard</h1>
    <div class="ctl">
      <div class="sim-seg" id="dentro" role="group" aria-label="Protoboard" data-act="ver"><button type="button" data-v="0">Por fuera</button><button type="button" data-v="1">Por dentro</button></div>
      <button type="button" class="pb-btn" id="ejemplo" data-act="arm">Ejemplo</button>
      <button type="button" class="pb-btn" id="vaciar" data-act="arm">Vaciar</button>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Protoboard de agua: cada tira de cinco agujeros es un canal, los rieles son tubos largos y la bomba los alimenta"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Protoboard con pila de 9 V, cables y resistencias que se arrastran a los agujeros"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261026224540"></script>
<script src="../../assets/protoboard.js?v=20261026224540"></script>
<script>
(() => {
  // La protoboard libre (Sim.protoboard): cables y resistencias de la bandeja.
  const pb = Sim.protoboard({ tray: ['wire', 'res'] });
  const { st, make, hole } = pb;
  // El ejemplo de cada paso: una resistencia de 1 kΩ (9 mA, 0,08 W) y dos de 1 kΩ en serie (la tira del medio queda
  // en 4,5 V).
  const example = () => {
    const red = { color: '#d6392b' }, black = { color: '#15212a' };
    pb.load([make('wire', hole(2, 0), hole(2, 2), red), ...(st.step === 0 ? [
      make('res', hole(2, 4), hole(6, 4), { R: 1000 }),
      make('wire', hole(6, 2), hole(6, 1), black)] : [
      make('res', hole(2, 4), hole(6, 4), { R: 1000 }),
      make('res', hole(6, 5), hole(10, 5), { R: 1000 }),
      make('wire', hole(10, 2), hole(10, 1), black)])]);
  };
  example();
  document.getElementById('ejemplo').addEventListener('click', example);
  document.getElementById('vaciar').addEventListener('click', pb.clear);

  // ---------- pasos ----------
  // 1: tocar un agujero resalta su tira (un nodo) con su voltaje. 2: dos resistencias con corriente.
  // Si no se ha movido nada, cada paso pone su ejemplo.
  const STEPS = ['Las tiras son nodos', 'Armar con resistencias'];
  Sim.steps(STEPS, k => { const was = st.step; st.step = k; if (!st.touched && st.step !== was) example(); }, k =>
    k === 0 ? !!st.sel : pb.live('res').length >= 2);
})();
</script>
</body>
</html>
