<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nodos · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261025004908">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Nodos</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua con bomba, un tramo angosto y, después, tramos angostos en paralelo que salen de la misma tubería; se transforma en nodos y tiene lugares punteados para agregar tramos"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico con fuente, R1 y, después, resistencias en paralelo entre los mismos dos nodos; se transforma en nodos y tiene lugares punteados para agregar resistencias"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261025004908"></script>
<script src="../../assets/banco.js?v=20261025004908"></script>
<script>
(() => {
  const { C, draw: D } = Sim;
  // Fuente de 9 V, R1 y luego hasta tres resistencias en paralelo (R2, R3, R4), cada una en su renglón entre
  // el mismo par de nodos: el del medio (B, la barra de la izquierda) y la tierra (C, la barra de la derecha).
  // Quedan tres nodos: A (9 V), B y C (0 V). Todo lo que se conecta a un nodo tiene su voltaje, y lo que entra
  // a un nodo sale de él: por R1 pasa la suma de lo que pasa por los renglones.
  // R2 siempre está; R3 y R4 se agregan tocando su lugar punteado (o con Armar) y se quitan en su tarjeta.
  // Son de 2 W y de 1 kΩ para arriba: con los 35 V de la fuente ninguna recibe más de 1,2 W, así que no se queman.
  const RVALUES = Sim.series(1000, 10000);
  const HMIN = 3, HMAX = Sim.PIPE - 3, LN = Math.log(10);
  const half = R => HMAX - (HMAX - HMIN) * Math.log(R / 1000) / LN;
  const fromHalf = h => Sim.nearest(RVALUES, 1000 * Math.exp((HMAX - Math.max(HMIN, Math.min(HMAX, h))) / (HMAX - HMIN) * LN));
  const ohm = Sim.ohm;
  const XA = 262, XB = 360, XR = 506;   // R1, la barra del nodo B y las resistencias de los renglones
  const st = { R: [1000, 1000, 1000, 1000], on: [true, true, false, false], slots: false };
  // Alto de cada renglón (R2 arriba, en el cable de arriba).
  const ys = g => { const h = g.BOT - g.TOP; return [g.TOP, g.TOP + 0.33 * h, g.TOP + 0.66 * h]; };
  // Renglones que se dibujan: los que tienen resistencia y, con los lugares a la vista, los vacíos.
  const rows = () => [0, 1, 2].filter(k => st.on[k + 1] || st.slots);
  const full = k => st.on[k + 1];

  // Tramos del circuito (sin la fuente), con su corriente: el de R1 (A), cada renglón, la barra del nodo B
  // (b0, b1: de un renglón al siguiente) y la del nodo C (c0, c1 y cz, que baja al − de la fuente).
  const segs = (g, m, V) => {
    const y = ys(g), P = rows(), I = k => m.Ik[k] || 0;
    const out = [{ id: 'A', pts: [[g.PX - b.SRC, g.BOT], [g.X0, g.BOT], [g.X0, g.TOP], [XB, g.TOP]], I: m.I, v0: V,
      comps: [comp(0, [XA, g.TOP], m.I * st.R[0] / 1000)] }];
    P.forEach((k, j) => {
      out.push({ id: 'r' + k, row: k, pts: [[XB, y[k]], [g.X1, y[k]]], I: I(k), v0: m.VB, comps: [comp(k + 1, [XR, y[k]], m.VB)] });
      const next = P[j + 1];
      if (next != null) {
        const after = P.slice(j + 1).reduce((s, q) => s + I(q), 0), upto = P.slice(0, j + 1).reduce((s, q) => s + I(q), 0);
        out.push({ id: 'b' + j, pts: [[XB, y[k]], [XB, y[next]]], I: after, v0: m.VB, comps: [] });
        out.push({ id: 'c' + j, pts: [[g.X1, y[k]], [g.X1, y[next]]], I: upto, v0: 0, comps: [] });
      } else out.push({ id: 'cz', pts: [[g.X1, y[k]], [g.X1, g.BOT], [g.PX + b.SRC, g.BOT]], I: m.I, v0: 0, comps: [] });
    });
    return out;
  };
  // Una resistencia (i: 0 es R1) o, si su lugar está vacío, el lugar punteado (abierto: no pasa nada).
  const comp = (i, at, dV) => {
    const on = st.on[i];
    return { id: 'R' + (i + 1), at, half: 46, dV, R: on ? st.R[i] : Infinity, pr: on ? pinch[i] : null, ext: on ? 22 : 18,
      tag: on ? () => ['R' + (i + 1), ohm(st.R[i])] : null,
      draw: (ctx, w) => on ? (w ? D.narrow(ctx, ...at, half(st.R[i])) : D.resistor(ctx, ...at)) : ghost(ctx, at, w) };
  };
  // Lugar punteado de una resistencia que falta, con su +.
  const ghost = (ctx, [x, y], w) => {
    const h = w ? Sim.PIPE + 6 : 16;
    D.roundRect(ctx, x - 46, y - h, 92, 2 * h, 10, C.card);
    ctx.save(); ctx.setLineDash([7, 6]);
    D.roundRect(ctx, x - 46, y - h, 92, 2 * h, 10, null, C.muted, 2);
    ctx.restore();
    D.line(ctx, [[x - 8, y], [x + 8, y]], 3, C.muted); D.line(ctx, [[x, y - 8], [x, y + 8]], 3, C.muted);
  };
  // Lo que se dibuja: cada tramo, y los renglones vacíos en dos pedazos (el cable llega a su lugar y ahí acaba).
  const pieces = (g, m) => segs(g, m, b.st.vo).flatMap(s => {
    if (s.row == null || full(s.row)) return [s];
    const [[x0, y], [x1]] = s.pts;
    return [{ ...s, id: s.id + 'a', pts: [[x0, y], [XR - 46, y]] }, { ...s, id: s.id + 'b', pts: [[XR + 46, y], [x1, y]] }];
  });
  // Perfil del agua de cada tramo: el angosto de R1 o el de su renglón.
  const profileOf = (g, s) => {
    if (s.id === 'A') return Sim.narrowProfile((g.PX - b.SRC - g.X0) + (g.BOT - g.TOP) + (XA - g.X0), half(st.R[0]));
    if (s.row != null && full(s.row)) return Sim.narrowProfile(XR - XB, half(st.R[s.row + 1]));
    return () => Sim.PIPE;
  };
  // El agua de cada tramo: se arma de nuevo si el tramo cambia de forma.
  const waters = new Map();
  const waterOf = (g, s) => {
    const key = JSON.stringify(s.pts);
    let w = waters.get(s.id);
    if (!w || w.key !== key) { w = { key, sim: Sim.water(s.pts, profileOf(g, s)) }; waters.set(s.id, w); }
    else w.sim.setProfile(profileOf(g, s));
    return w.sim;
  };
  const phase = {};
  const K = 12;   // rapidez de las partículas por mA

  const b = Sim.bench({
    iFull: 12, v0: 9,
    layout() { waters.clear(); },
    model(V) {
      const G = [0, 1, 2].reduce((s, k) => s + (st.on[k + 1] ? 1 / st.R[k + 1] : 0), 0);
      const I = G ? V / (st.R[0] + 1 / G) * 1000 : 0, VB = V - I * st.R[0] / 1000;
      return { I, VB, Ik: [0, 1, 2].map(k => st.on[k + 1] ? VB / st.R[k + 1] * 1000 : 0) };
    },
    circuit: (g, m, V) => segs(g, m, V),
    step(dt, m) {
      // con un multímetro en A haciendo un corto, la vuelta de afuera lleva lo que de verdad da la fuente
      const f = m.I > 0 ? b.flowI(m) / m.I : 1;
      for (const s of pieces(b.ge, m)) phase[s.id] = (phase[s.id] || 0) + s.I * f * K * dt;
      for (const s of pieces(b.gw, m)) waterOf(b.gw, s).step(s.I * f * K, dt);
    },
    drawW(ctx, g, m) {
      const ps = pieces(g, m);
      if (labels()) halo(ctx, g, true);
      ps.forEach(s => D.pipe(ctx, s.pts));
      drawComps(ctx, g, m, true, () => ps.forEach(s => waterOf(g, s).draw(ctx)));
    },
    drawE(ctx, g, m) {
      const ps = pieces(g, m);
      if (labels()) halo(ctx, g, false);
      ps.forEach(s => D.wire(ctx, s.pts));
      ps.forEach(s => D.flow(ctx, s.pts, phase[s.id] || 0, C.charge, { gap: 30, r: 4.5 }));
      drawComps(ctx, g, m, false);
    }
  });
  // Los componentes, con sus asas y su etiqueta; en el agua, el agua pasa por encima de los tramos angostos.
  function drawComps(ctx, g, m, w, water) {
    const y = ys(g), at = [[XA, g.TOP], ...[0, 1, 2].map(k => [XR, y[k]])];
    const shown = [0, ...rows().map(k => k + 1)];
    shown.forEach(i => comp(i, at[i], 0).draw(ctx, w));
    if (water) water();
    shown.forEach(i => {
      if (!st.on[i]) return;
      const [x, yy] = at[i], h = half(st.R[i]) + 5, name = 'R' + (i + 1), value = ohm(st.R[i]);
      b.grips(ctx, x, yy, h, pinch[i]);
      if (!labels()) { b.tag(ctx, pinch[i], x, yy - h - 30, name, value); return; }
      // con lo que pasa por ella al lado, sin salirse de entre los cables de su renglón
      const I = i ? m.Ik[i - 1] || 0 : m.I, tw = D.tagWidth(ctx, name, value, ''), cw = current(ctx, false, 0, 0, I, w);
      const right = g.mode === 'lateral' ? g.DESK : g.VX + g.W;   // lo que se ve del dibujo (en el acostado, hasta la mesa)
      const all = tw + 12 + cw, lo = (i ? XB : g.VX) + 8 + all / 2, hi = (i ? right : XB) - 8 - all / 2;
      const x0 = (lo > hi ? (lo + hi) / 2 : Math.max(lo, Math.min(hi, x))) - all / 2;
      b.tag(ctx, pinch[i], x0, yy - h - 30, name, value, false, true);
      current(ctx, true, x0 + tw + 12, yy - h - 30, I, w);
    });
  }

  // Paso 3: lo que pasa por cada resistencia, en verde (corriente) al lado de su etiqueta, y el nodo B con un
  // fondo azul claro (la barra y los cables que llegan a sus componentes): lo que entra por R1 sale por los renglones.
  let step = 0;
  const labels = () => step === 2 && !b.nodesOn();
  function halo(ctx, g, w) {
    const y = ys(g), P = rows(), wd = w ? 2 * Sim.PIPE + 26 : 22;
    ctx.save(); ctx.globalAlpha = 0.18;
    D.line(ctx, [[XA + 46, g.TOP], [XB, g.TOP], [XB, y[P[P.length - 1]]]], wd, C.sel);
    P.forEach(k => D.line(ctx, [[XB, y[k]], [XR - 46, y[k]]], wd, C.sel));
    ctx.restore();
  }
  // Pastilla verde con una flecha y la corriente, que empieza en x; da su ancho (y la dibuja si draw).
  function current(ctx, draw, x, y, I, w) {
    const t = Sim.fmt(Math.abs(I) < 0.005 ? 0 : I, 2) + (w ? ' mL/s' : ' mA'), px = D.font(ctx, 16, Sim.MONO, 600);
    const a = px * 0.35, hh = Math.round(px * 1.45), wd = ctx.measureText(t).width + 2 * a + 26;
    if (!draw) return wd;
    D.roundRect(ctx, x, y - hh / 2, wd, hh, hh / 2, C.card, C.ok, 2);
    D.arrow(ctx, x + 10 + a * 0.7, y, 0, a, C.ok);
    D.text(ctx, t, x + 16 + 2 * a, y + 0.5, C.ok, { size: 16, font: Sim.MONO, weight: 600, align: 'left' });
    return wd;
  }

  // Cada resistencia se ajusta pellizcándola o en su tarjeta; R3 y R4 también se quitan ahí.
  const pinch = [0, 1, 2, 3].map(i => {
    const set = R => { st.R[i] = R; touched(); };
    const pos = g => i ? [XR, ys(g)[i - 1]] : [XA, g.TOP];
    return b.pinch({
      pos, get: () => st.R[i], half, fromHalf, set,
      label: side => (side === 'w' ? 'Tramo angosto ' : 'Resistencia ') + (i + 1),
      text: ohm,
      menu: Sim.resistorMenu({ name: 'R' + (i + 1), values: RVALUES, get: () => st.R[i], set, format: ohm,
        actions: i > 1 ? side => [{ text: side === 'w' ? 'Quitar el tramo' : 'Quitar la resistencia', onClick: () => remove(i) }] : null })
    });
  });
  // Lugares punteados de R3 y R4 (de Armar): tocarlos pone una de 1 kΩ.
  [2, 3].forEach(i => b.linkedButton({
    cls: 'sim-slot', label: side => side === 'w' ? `Agregar un tramo angosto (R${i + 1})` : `Agregar una resistencia (R${i + 1})`,
    pos: g => {
      ['pw', 'pe'].forEach(p => b[p].box.querySelectorAll('.slot-r' + i).forEach(el => {
        el.style.width = 92 * b[p].scale + 'px'; el.style.height = 2 * (Sim.PIPE + 6) * b[p].scale + 'px';
      }));
      return [XR, ys(g)[i - 1]];
    },
    hidden: () => !st.slots || st.on[i], onClick: () => add(i)
  }).forEach(el => { el.classList.add('slot-r' + i); el.dataset.act = 'arm'; }));
  const addBtn = Sim.side && Sim.side.button('arm', '', () => { const i = [2, 3].find(k => !st.on[k]); if (i) add(i); });
  const sync = () => {
    pinch.forEach((pr, i) => pr.els.forEach(el => { el.hidden = !st.on[i]; }));
    if (addBtn) {
      addBtn.textContent = Sim.view === 'w' ? 'Agregar un tramo angosto' : 'Agregar una resistencia';
      addBtn.hidden = !st.slots || (st.on[2] && st.on[3]);
      addBtn.closest('section').hidden = addBtn.hidden;   // Armar solo trae este botón
    }
    b.refresh();
  };
  Sim.onView(sync);
  function add(i) { st.on[i] = true; st.R[i] = 1000; touched(); sync(); }
  function remove(i) {
    pinch[i].els.forEach(el => Sim.menu.close(el));
    st.on[i] = false; touched(); sync();
  }
  let changed = false;
  function touched() { if (step === 2) changed = true; }

  // La bomba y la fuente empiezan encendidas; esta página no usa el multímetro.
  document.querySelector('#pe .sim-power').click();
  b.showMeters({ a: false });
  sync();
  b.start();

  // Por pasos: al empezar se ve el circuito y al momento se transforma en nodos; luego aparecen los lugares
  // punteados para conectar más resistencias entre los mismos dos nodos; al final, en el circuito, lo que entra
  // al nodo B y lo que sale de él.
  const STEPS = ['Los nodos', 'Agregar componentes', 'Lo que entra, sale'];
  let timer = 0;
  Sim.steps(STEPS, k => {
    step = k; st.slots = k > 0; changed = false;
    clearTimeout(timer);
    if (k === 0) { b.setNodes(false); timer = setTimeout(() => b.setNodes(true), 900); }
    else b.setNodes(k === 1);
    sync();
  }, k => k === 0 ? !!b.net() : k === 1 ? st.on[2] || st.on[3] : changed);
})();
</script>
</body>
</html>
