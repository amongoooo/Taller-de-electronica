<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Capacitores</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="0">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua con bomba, válvula de tres vías, tramo angosto ajustable y tanque con membrana elástica"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico con fuente, conmutador de carga y descarga, resistencia ajustable y capacitor"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261026213941"></script>
<script src="../../assets/osciloscopio.js?v=20261026213941"></script>
<script src="../../assets/banco.js?v=20261026213941"></script>
<script>
(() => {
  const { C, draw: D, fmt } = Sim;
  // Circuito RC. Arriba, la resistencia (tramo angosto) y el capacitor (tanque con una membrana elástica
  // que no deja pasar el agua: se estira y empuja de regreso). A la izquierda, un conmutador (válvula de
  // tres vías): en "cargar" conecta la fuente; en "descargar" un puente que pasa por encima de la fuente
  // cierra el circuito solo con la resistencia y el capacitor.
  const RMIN = 470, RMAX = 10000, HMIN = 3, HMAX = Sim.PIPE - 3, LN = Math.log(RMAX / RMIN);
  const CMIN = 220, CMAX = 4700, RCMIN = 18, RCMAX = 48, LNC = Math.log(CMAX / CMIN);   // capacidad en µF
  // Valores comunes: resistencias de la serie E12 y capacitores de la E6 (220, 330, 470, 680 µF…).
  const RVALUES = Sim.series(RMIN, RMAX), CVALUES = Sim.series(CMIN, CMAX, [1, 1.5, 2.2, 3.3, 4.7, 6.8]);
  const half = R => HMAX - (HMAX - HMIN) * Math.log(R / RMIN) / LN;
  const fromHalf = h => Sim.nearest(RVALUES, RMIN * Math.exp((HMAX - Math.max(HMIN, Math.min(HMAX, h))) / (HMAX - HMIN) * LN));
  const rcOf = c => RCMIN + (RCMAX - RCMIN) * Math.log(c / CMIN) / LNC;   // radio del tanque
  const cOf = r => Sim.nearest(CVALUES, CMIN * Math.exp((Math.max(RCMIN, Math.min(RCMAX, r)) - RCMIN) / (RCMAX - RCMIN) * LNC));
  const ohm = Sim.ohm;
  const uF = c => c + ' µF';
  const K = 6;                     // px que avanzan las partículas por cada mC (como I·6 en las demás)
  const XR = 300, XC = 520;        // resistencia y capacitor, en el cable de arriba
  const st = { R: 1000, C: 2200, charge: true, Vc: 0, rb: false, burnT: 9, cb: false, cbT: 9, P: 0,
    ph: { A: 0, C: 0, B: 0, N: 0 }, I: { A: 0, C: 0, B: 0, N: 0 } };
  const sides = {};
  // La resistencia (¼ W) se calienta con I²·R mientras pasa corriente (Sim.heat), y su menú lo muestra. Al
  // empezar a cargar recibe V²/R solo un instante; si la carga dura (un capacitor grande), se calienta más: con
  // 35 V, 470 Ω y 4700 µF (τ = 2,2 s) llega a 161 °C y se quema (con 1 kΩ, 137 °C; con 12 V, 41 °C). Quemada
  // abre el circuito: el capacitor se queda con su carga.
  // El capacitor guarda energía (½·C·V²) y es de 50 V (la fuente da 35 como máximo: por voltaje no se daña). Es
  // electrolítico: tiene polaridad (la placa curva, o el lado − del tanque, va al − de la fuente). Al revés, de
  // VK para arriba su óxido ya no aísla y conduce por dentro (como una resistencia RL después de VK): ya no se
  // carga más y esa corriente lo calienta (Sim.HEAT.cap, con su potencia (−Vc)·I). Con 9 V y 1 kΩ pasan 7,9 mA,
  // 8,5 mW: se daña en unos 3 s; con 10 kΩ, 0,8 mA, solo se entibia. Dañado ya no guarda carga y queda casi en
  // corto (RL) para los dos lados; en el agua, la membrana rota deja pasar el agua.
  const rh = Sim.heat(Sim.HEAT.res), ch = Sim.heat(Sim.HEAT.cap), CAP_V = 50, VK = 1, RL = 10;
  const capRev = () => !st.cb && st.Vc < -0.5;   // al revés (cargado con el − en su +)
  const joules = E => fmt(E, E < 0.1 ? 3 : 2) + ' J';
  const capState = () => st.cb ? 'dañado' : capRev() ? 'al revés' : '';
  // Carga exacta: Vc se acerca a Ventrada con τ = R·C (R = Infinity: la resistencia quemada, no pasa nada). Al
  // revés, de VK para arriba también conduce RL: Vc va a lo que dan R y RL juntos, con τ = C·(R ∥ RL). En pasos
  // cortos para cambiar de un caso al otro. Deja en st.P la potencia en el capacitor y devuelve los mC que pasaron
  // por la resistencia.
  function charge(Vin, R, dt) {
    const gR = R === Infinity ? 0 : 1 / R, Cf = st.C * 1e-6, n = 8, h = dt / n;
    if (st.cb) { st.Vc = gR ? Vin * RL / (R + RL) : 0; st.P = 0; return gR * (Vin - st.Vc) * dt * 1000; }
    let q = 0;
    for (let k = 0; k < n; k++) {
      const leak = st.Vc < -VK, gg = gR + (leak ? 1 / RL : 0);
      if (!gg) continue;
      const veq = (gR * Vin - (leak ? VK / RL : 0)) / gg, T = Cf / gg, e = Math.exp(-h / T), v0 = st.Vc;
      st.Vc = veq + (v0 - veq) * e;
      q += gR * (Vin - (veq + (v0 - veq) * T / h * (1 - e))) * h;   // con el Vc promedio del paso
    }
    st.P = st.Vc < -VK ? -st.Vc * (-st.Vc - VK) / RL : 0;
    return q * 1000;
  }

  // Nodos: J es el conmutador en el lado izquierdo; N donde el puente llega al cable de abajo.
  const nodes = g => {
    const XN = g.PX + 75, YB = g.BOT - 64;
    return { XN, YB, J: [g.X0, YB], P: [g.X0, YB - 22], A: [g.X0, YB + 22], B: [g.X0 + 22, YB] };
  };
  // Recorridos de cada tramo, en el sentido de la corriente al cargar.
  //   A: de la fuente (+) al conmutador        C: del conmutador, por la resistencia y el capacitor, hasta N
  //   B: el puente de descarga, hasta N        N: de N a la fuente (−)
  const paths = g => {
    const n = nodes(g), S = 40;   // medio ancho de la bomba y la fuente (b.SRC)
    return {
      A: [[g.PX - S, g.BOT], [g.X0, g.BOT], n.A],
      C: [n.P, [g.X0, g.TOP], [g.X1, g.TOP], [g.X1, g.BOT], [n.XN, g.BOT]],
      B: [n.B, [n.XN, n.YB], [n.XN, g.BOT]],
      N: [[n.XN, g.BOT], [g.PX + S, g.BOT]]
    };
  };
  // El tramo C partido en el capacitor: antes (C1) y después (C2) de la membrana (o de las placas).
  const split = (g, gap) => {
    const p = paths(g).C;
    return { C1: [p[0], p[1], [XC - gap, g.TOP]], C2: [[XC + gap, g.TOP], p[2], p[3], p[4]] };
  };

  const stream = Sim.stream;   // agua en un tramo abierto (ver sim.js)
  const build = side => {
    const s = sides[side];
    if (!s) return;
    const g = s.g, p = paths(g);
    s.p = p;
    if (side === 'w') {
      const c = split(g, rcOf(st.C) - 2);
      const dc = (p.C[0][1] - g.TOP) + (XR - g.X0);
      s.streams = { A: stream(p.A), C1: stream(c.C1, Sim.narrowProfile(dc, half(st.R))), C2: stream(c.C2), B: stream(p.B), N: stream(p.N) };
    } else s.wires = { ...split(g, 7), A: p.A, B: p.B, N: p.N };
  };

  const b = Sim.bench({
    iFull: 10, v0: 9, stateful: true, nodes: false,
    // El osciloscopio en la mesa, como en el taller: el canal 1 en el capacitor (entre la resistencia y él), el canal 2
    // a la entrada (antes de la resistencia: la fuente al cargar, 0 V al descargar) y el caimán en la tierra (la subida
    // de la derecha, después del capacitor). 2 V por división con el cero 3.5 divisiones abajo (9 V caben) y 1 s por
    // división (τ = 1 kΩ × 2200 µF = 2.2 s: la carga cabe en la pantalla); el disparo, en la subida de la entrada.
    scope: { vd: [2, 2], pos: [-3.5, -3.5], td: 1000, ch2: true, trig: { src: 1, slope: 1, mode: 'auto', level: 1 },
      meas: [[0, 'max'], [0, 'min'], [1, 'max'], [0, 'mean'], null],
      probes: g => [[(XR + 46 + XC - RCMAX) / 2, g.TOP], [g.X1, (g.TOP + g.BOT) / 2], [(g.X0 + XR - 46) / 2, g.TOP]] },
    head: RCMAX + 42, // el rótulo del tanque más grande
    layout(g) { sides[g.side] = { g }; build(g.side); },
    // El capacitor empuja de regreso con su voltaje Vc: la corriente es (Ventrada − Vc) / R (dañado, Ventrada /
    // (R + RL)). I es lo que pasa por la fuente (y mueve la bomba); Ic lo que pasa por la resistencia y el capacitor.
    model(V) {
      const Vin = st.charge ? V : 0, Ic = st.rb ? 0 : st.cb ? Vin / (st.R + RL) * 1000 : (Vin - st.Vc) / st.R * 1000;
      return { I: st.charge ? Ic : 0, Ic, Vin };
    },
    circuit(g, m, V) {
      const p = paths(g), n = nodes(g), Ic = m.Ic || 0, rc = rcOf(st.C);
      return [
        { pts: p.A, I: st.charge ? Ic : 0, v0: V, comps: [] },
        // el conmutador: une el circuito con la fuente (cargar) o con el puente (descargar)
        st.charge ? { pts: [n.A, n.P], I: Ic, v0: V, comps: [], link: true } : { pts: [n.B, n.P], I: Ic, v0: 0, comps: [], link: true },
        { pts: p.C, I: Ic, v0: st.charge ? V : 0, comps: [
          { at: [XR, g.TOP], half: 46, dV: st.rb ? (st.charge ? V : 0) - st.Vc : Ic * st.R / 1000, R: st.rb ? Infinity : st.R, pr: pinchR },
          { at: [XC, g.TOP], half: rc, dV: st.Vc, R: st.cb ? RL : undefined, pr: pinchC, ext: rc + 4 }] },
        { pts: p.B, I: st.charge ? 0 : -Ic, v0: 0, comps: [] },
        { pts: p.N, I: st.charge ? Ic : 0, v0: 0, comps: [] }
      ];
    },
    step(dt, m) {
      const dq = charge(m.Vin ?? 0, st.rb ? Infinity : st.R, dt);   // mC que pasaron por la resistencia
      const dp = dq * K;
      st.ph.C += dp;
      if (st.charge) { st.ph.A += dp; st.ph.N += dp; } else st.ph.B -= dp;
      const I = dt ? dq / dt : 0;              // mA promedio en este cuadro
      st.I = { C: I, A: st.charge ? I : 0, N: st.charge ? I : 0, B: st.charge ? 0 : -I };
      if (rh.step(st.rb ? 0 : (I / 1000) ** 2 * st.R, dt) && !st.rb) { st.rb = true; st.burnT = 0; b.halt(); b.refresh(); }
      if (ch.step(st.cb ? 0 : st.P, dt) && !st.cb) { st.cb = true; st.cbT = 0; b.halt(); b.refresh(); }
      st.burnT += dt; st.cbT += dt;
    },
    drawW(ctx, g, m) {
      const s = sides.w, n = nodes(g), rc = rcOf(st.C), c = split(g, rc - 2);
      for (const k of ['A', 'B', 'N']) D.pipe(ctx, s.p[k]);
      D.pipe(ctx, c.C1); D.pipe(ctx, c.C2);
      D.narrow(ctx, XR, g.TOP, half(st.R));
      for (const k of ['A', 'B', 'N']) s.streams[k].draw(ctx, st.ph[k], st.I[k] * K);
      s.streams.C1.draw(ctx, st.ph.C, st.I.C * K); s.streams.C2.draw(ctx, st.ph.C, st.I.C * K);
      D.burstPipe(ctx, XR, g.TOP, half(st.R), st.burnT, st.rb, rh.glow, '');
      if (!st.cb) D.heatGlow(ctx, XC, g.TOP, ch.glow, rc + 24);
      tank(ctx, g, rc);
      valve(ctx, n);
      b.grips(ctx, XR, g.TOP, half(st.R) + 5, pinchR);
      b.grips(ctx, XC, g.TOP, rc + 4, pinchC);
      b.tag(ctx, pinchR, XR, g.TOP - half(st.R) - 42, 'tramo angosto', ohm(st.R), st.rb, false, st.rb ? 'reventado' : '');
      capTag(ctx, g, rc, ['tanque con membrana', 'tanque']);
      switchTag(ctx, g, n, ['válvula de tres vías', 'válvula', '']);
    },
    drawE(ctx, g, m) {
      const s = sides.e, n = nodes(g), rc = rcOf(st.C);
      for (const k of ['A', 'B', 'N', 'C1', 'C2']) D.wire(ctx, s.wires[k]);
      for (const k of ['A', 'B', 'N']) D.flow(ctx, s.wires[k], st.ph[k], C.charge, { gap: 30, r: 4.5 });
      D.flow(ctx, s.wires.C1, st.ph.C, C.charge, { gap: 30, r: 4.5 });
      D.flow(ctx, s.wires.C2, st.ph.C, C.charge, { gap: 30, r: 4.5 });
      D.circle(ctx, n.XN, g.BOT, 5, C.ink);
      if (!st.rb) D.heatGlow(ctx, XR, g.TOP, rh.glow);
      D.resistor(ctx, XR, g.TOP);
      if (st.rb) D.burntResistor(ctx, XR, g.TOP, st.burnT, '');
      if (!st.cb) D.heatGlow(ctx, XC, g.TOP, ch.glow, rc + 24);
      capacitor(ctx, g, rc);
      knife(ctx, n);
      b.grips(ctx, XR, g.TOP, half(st.R) + 5, pinchR);
      b.grips(ctx, XC, g.TOP, rc + 4, pinchC);
      b.tag(ctx, pinchR, XR, g.TOP - half(st.R) - 42, 'resistencia', ohm(st.R), st.rb, false, st.rb ? 'quemada' : '');
      capTag(ctx, g, rc, ['capacitor', 'C']);
      switchTag(ctx, g, n, ['conmutador', '']);
    }
  });
  // El rótulo del capacitor, con su estado: sin salirse del dibujo (si no cabe, con el nombre corto).
  const capTag = (ctx, g, rc, name) => b.tagRow(ctx, g, g.TOP - rc - 30,
    [{ x: XC, pr: pinchC, name, value: uF(st.C), danger: st.cb || capRev(), state: capState() }]);
  // La válvula de tres vías (el conmutador) va en el cable de la izquierda: su nombre a la derecha, debajo del
  // puente, y si carga o descarga en una pastilla (si no cabe antes del + de la fuente, solo la pastilla).
  const switchTag = (ctx, g, n, name) => D.tag(ctx, g.X0 + 30, n.YB + 30, name, '',
    { state: st.charge ? 'cargar' : 'descargar', align: 'left', max: g.PX - 46 - (g.X0 + 30) });   // sin llegar a la bomba

  // Tanque redondo partido por una membrana elástica. La membrana se estira hacia la derecha según la presión
  // que aguanta (el voltaje del capacitor) y empuja el agua de regreso. Su lado − (el de la derecha, que va a la
  // bomba) lleva su marca, como la franja de un electrolítico; al revés la membrana se estira hacia la izquierda
  // (en rojo) y, dañada, queda rota: el agua pasa por en medio.
  function tank(ctx, g, rc) {
    const y = g.TOP, bulge = st.cb ? 0 : Math.max(-1, Math.min(1, st.Vc / b.vScale())) * 0.8 * rc, sgn = bulge < 0 ? -1 : 1;
    D.circle(ctx, XC, y, rc + 5, C.pipe);
    D.circle(ctx, XC, y, rc, C['water-soft']);
    ctx.save(); ctx.beginPath(); ctx.arc(XC, y, rc, 0, Math.PI * 2); ctx.clip();
    // del lado que empuja el agua está más apretada: un poco más oscura según la presión
    ctx.globalAlpha = 0.25 * Math.abs(bulge) / (0.8 * rc || 1);
    ctx.beginPath(); ctx.moveTo(XC, y - rc); ctx.quadraticCurveTo(XC + 2 * bulge, y, XC, y + rc);
    ctx.lineTo(XC - sgn * rc, y + rc); ctx.lineTo(XC - sgn * rc, y - rc); ctx.closePath(); ctx.fillStyle = C.water; ctx.fill();
    ctx.globalAlpha = 1; ctx.restore();
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    if (st.cb) {   // rota: dos jirones arrugados, uno arriba y otro abajo
      ctx.strokeStyle = C.danger;
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(XC, y + s * rc); ctx.lineTo(XC + 5, y + s * rc * 0.72); ctx.lineTo(XC - 4, y + s * rc * 0.5);
        ctx.lineTo(XC + 3, y + s * rc * 0.32); ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.moveTo(XC, y - rc); ctx.quadraticCurveTo(XC + 2 * bulge, y, XC, y + rc);
      ctx.strokeStyle = capRev() ? C.danger : C.ink; ctx.stroke();
    }
    D.text(ctx, '−', XC + rc * 0.72 + 12, y + rc * 0.72 + 8, C.neg, { size: 20, weight: 800 });
  }
  // Capacitor electrolítico: la placa recta es la + y la curva la − (más grandes con más capacidad), un + del lado
  // positivo y la carga que se junta en cada placa. Dañado, tiznado y con humo.
  function capacitor(ctx, g, rc) {
    const y = g.TOP, ph = rc * 0.75 + 4;
    ctx.fillStyle = C.card; ctx.fillRect(XC - 7, y - ph - 2, 13, 2 * ph + 4);
    D.line(ctx, [[XC - 7, y - ph], [XC - 7, y + ph]], 4.5, C.ink, 'butt');
    ctx.beginPath(); ctx.moveTo(XC + 10, y - ph); ctx.quadraticCurveTo(XC + 2, y, XC + 10, y + ph);
    ctx.lineWidth = 4.5; ctx.strokeStyle = C.ink; ctx.lineCap = 'butt'; ctx.stroke();
    D.text(ctx, '+', XC - 28, y - ph - 4, C.ink, { size: 16 });
    if (st.cb) {
      ctx.fillStyle = 'rgba(30, 20, 15, 0.55)'; ctx.beginPath(); ctx.ellipse(XC, y, 16, ph * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      if (st.cbT < 6) D.smoke(ctx, XC, y - ph, st.cbT);
      return;
    }
    const n = Math.round(Math.min(1, Math.abs(st.Vc) / b.vScale()) * (2 * ph) / 9), pos = st.Vc >= 0;
    for (let k = 0; k < n; k++) {
      const yy = y - ph + 5 + (2 * ph - 10) * (n > 1 ? k / (n - 1) : 0.5);
      D.text(ctx, pos ? '+' : '−', XC - 18, yy, pos ? '#d6392b' : C.neg, { size: 14 });
      D.text(ctx, pos ? '−' : '+', XC + 18, yy, pos ? C.neg : '#d6392b', { size: 14 });
    }
  }
  // Válvula de tres vías: arriba va al circuito; abajo, a la bomba (cargar); a la derecha, al puente (descargar).
  function valve(ctx, n) {
    const [x, y] = n.J, P = Sim.PIPE - 3;
    D.circle(ctx, x, y, 23, C.metal, C.ink, 2.5);
    ctx.fillStyle = C['water-soft'];
    ctx.fillRect(x - P, y - 23, 2 * P, 23 + P);                  // de arriba al centro
    if (st.charge) ctx.fillRect(x - P, y, 2 * P, 23);            // al centro y abajo
    else ctx.fillRect(x, y - P, 23, 2 * P);                      // al centro y a la derecha
    ctx.fillStyle = C.danger;                                    // la salida cerrada
    if (st.charge) ctx.fillRect(x + 15, y - P - 1, 6, 2 * P + 2); else ctx.fillRect(x - P - 1, y + 15, 2 * P + 2, 6);
  }
  // Conmutador de cuchilla: la cuchilla va de arriba (P) a abajo (A, cargar) o a la derecha (B, descargar).
  function knife(ctx, n) {
    const [x, y] = n.J;
    ctx.fillStyle = C.card; ctx.fillRect(x - 10, y - 24, 36, 48);
    for (const [cx, cy] of [n.P, n.A, n.B]) D.circle(ctx, cx, cy, 5, C.card, C.ink, 2.5);
    const to = st.charge ? n.A : n.B;
    D.line(ctx, [n.P, [to[0] + (st.charge ? 0 : -4), to[1] + (st.charge ? -4 : 0)]], 3.5, C.ink);
  }

  const rebuild = () => { build('w'); build('e'); };
  // Tocar la resistencia o el capacitor abre su menú.
  const setR = R => { st.R = R; rebuild(); }, setC = c => { st.C = c; rebuild(); };
  const pinchR = b.pinch({
    pos: g => [XR, g.TOP], get: () => st.R, half, fromHalf, set: setR,
    label: side => side === 'w' ? 'Tramo angosto' : 'Resistencia',
    text: ohm,
    menu: Sim.resistorMenu({ values: RVALUES, get: () => st.R, set: setR, format: ohm, heat: rh, broken: () => st.rb,
      actions: side => [{ text: side === 'w' ? 'Poner un tubo nuevo' : 'Poner una resistencia nueva', primary: true, hidden: () => !st.rb,
        onClick: () => { st.rb = false; rh.reset(); st.burnT = 9; } }] })
  });
  const pinchC = b.pinch({
    pos: g => [XC, g.TOP], get: () => st.C, half: rcOf, fromHalf: cOf, set: setC,
    label: side => side === 'w' ? 'Tanque con membrana' : 'Capacitor',
    text: uF,
    menu: side => ({
      title: side === 'w' ? 'Tanque con membrana' : 'Capacitor',
      rows: [{ label: side === 'w' ? 'Tamaño (capacidad)' : 'Capacidad', values: CVALUES, get: () => st.C, set: setC, format: uF },
        // lo que aguanta, lo que tiene ahora y la energía que lleva guardada (la barra se llena a 50 V); al revés
        // (o tibio, o dañado), lo que aguanta al revés y su temperatura (en el agua, el desgaste de la membrana)
        { heat: () => {
          const w = side === 'w', u = w ? ' psi' : ' V', E = v => 0.5 * st.C * 1e-6 * v * v;
          if (st.cb || capRev() || ch.f > 0.01) return {
            label: w ? 'Presión al revés · desgaste' : 'Voltaje al revés · temperatura',
            rated: '−' + fmt(VK, 0) + u, now: fmt(st.Vc, 2).replace('-', '−') + u, over: !st.cb && st.Vc < -VK,
            f: st.cb ? 1 : ch.f, burnt: st.cb, name: w ? 'Desgaste' : 'Temperatura',
            val: st.cb ? (w ? 'se rompió' : 'se dañó') : w ? Math.round(100 * Math.min(1, ch.f)) + ' %' : Math.round(ch.T) + ' °C',
            end: w ? 'se rompe' : 'se daña a ' + ch.tMax + ' °C' };
          return { label: w ? 'Presión · energía guardada en la membrana' : 'Voltaje · energía guardada (½·C·V²)',
            rated: CAP_V + u, now: fmt(Math.max(0, st.Vc), 1) + u, over: st.Vc > CAP_V,
            f: E(st.Vc) / E(CAP_V), name: 'Energía', val: joules(E(st.Vc)), end: 'llena: ' + joules(E(CAP_V)) };
        } },
        { actions: [{ text: side === 'w' ? 'Poner un tanque nuevo' : 'Poner un capacitor nuevo', primary: true, hidden: () => !st.cb,
          onClick: () => { st.cb = false; ch.reset(); st.cbT = 9; st.Vc = 0; st.P = 0; } }] }]
    })
  });
  pinchC.els.forEach(el => el.classList.add('cap'));
  // Tocar el conmutador (o la válvula) lo cambia entre cargar y descargar.
  b.linkedButton({
    cls: 'sim-hit', pos: g => nodes(g).J,
    label: side => (st.charge ? 'Pasar a descargar' : 'Pasar a cargar') + (side === 'w' ? ' (válvula de tres vías)' : ' (conmutador)'),
    onClick: () => { st.charge = !st.charge; }
  });
  // El multímetro (en V) empieza conectado al capacitor: la roja entre la resistencia y el capacitor, la negra a la derecha.
  b.st.clamps.a = [[(XR + 46 + XC - RCMAX) / 2, b.gw.TOP], [b.gw.X1, b.gw.MY]];
  b.start();
})();
</script>
