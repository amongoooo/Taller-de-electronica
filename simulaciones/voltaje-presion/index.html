<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voltaje y presión · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261019064536">
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Voltaje y presión</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua: controlador de la bomba con botón de encendido, LED, perilla de presión y medidor de velocidad; manómetro, tramo angosto y medidor de caudal"></canvas>
      <div class="sim-layer">
        <button class="sim-power" id="bomba" type="button" aria-pressed="false" aria-label="Encender la bomba"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
        <div id="perillaW"></div>
      </div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico: fuente con botón, perilla de voltaje y medidor; voltímetro, resistencia de 1 kΩ y amperímetro"></canvas>
      <div class="sim-layer">
        <button class="sim-power" id="fuente" type="button" aria-pressed="false" aria-label="Encender la fuente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
        <div id="perillaE"></div>
      </div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261019064536"></script>
<script>
(() => {
  const { C, draw: D, fmt, digits } = Sim;
  const R = 1000;            // ohmios; el tramo angosto equivale a esta resistencia
  const VMAX = 12;           // V máximos de la fuente
  const KPA_PER_V = 10;      // la presión de la bomba en kPa equivale a 10 × el voltaje
  const MLS_PER_MA = 10;     // el caudal en mL/s equivale a 10 × la corriente en mA
  const RPM_PER_MA = 100;    // velocidad de la bomba: 10 rpm por cada mL/s (60 mL/s = 600 rpm)
  const IFULL = 12;          // mA a escala completa
  const size = Sim.fitHeight(800, 590, 1040);

  // Geometría de un panel: ancho fijo y alto que se adapta; los dos circuitos usan la misma.
  function geometry(W, H) {
    const g = { W, H, X0: 180, X1: 640, PX: 400, TOP: 120, BOT: H - 214 };
    g.MIDY = (g.TOP + g.BOT) / 2;
    g.BX = g.PX - 215; g.BY = g.BOT + 46; g.BW = 430; g.BH = 152;   // caja del controlador
    g.loop = D.rect(g.X0, g.TOP, g.X1, g.BOT);   // sube por la izquierda, cruza arriba, baja y regresa por abajo
    return g;
  }

  // Cada lado tiene su propio controlador; los dos usan el mismo modelo con inercia.
  const side = () => ({ level: Sim.ramp(), on: false, set: 6, v: 0, i: 0, rpm: 0, omega: 0, rotor: 0, phase: 0,
    nV: Sim.needle(), nI: Sim.needle(), nS: Sim.needle() });
  const W_ = side(), E_ = side();
  let tau = 1;
  const hn = Sim.narrowHalf(R);

  let gw, ge, water;
  const pw = Sim.panel(document.getElementById('pw'), size);
  const pe = Sim.panel(document.getElementById('pe'), size);
  pw.onLayout = (W, H) => {
    gw = geometry(W, H);
    water = Sim.water(gw.loop, Sim.narrowProfile((gw.BOT - gw.TOP) + (gw.PX - gw.X0), hn));
  };
  pe.onLayout = (W, H) => { ge = geometry(W, H); };
  pw.onLayout(pw.W, pw.H); pe.onLayout(pe.W, pe.H);

  // ---------- controles ----------
  // La bomba y la fuente están enlazadas: el botón o la perilla de una mueven también la otra.
  const btns = ['bomba', 'fuente'].map(id => document.getElementById(id));
  const setOn = on => {
    W_.on = E_.on = on;
    btns.forEach(b => {
      b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-label', (on ? 'Apagar' : 'Encender') + (b.id === 'bomba' ? ' la bomba' : ' la fuente'));
    });
  };
  btns.forEach(b => b.addEventListener('click', () => setOn(!W_.on)));
  pw.at(btns[0], () => [gw.BX + 58, gw.BY + 92]);
  pe.at(btns[1], () => [ge.BX + 58, ge.BY + 92]);
  pw.at(document.getElementById('perillaW'), () => [gw.PX, gw.BY + 80]);
  pe.at(document.getElementById('perillaE'), () => [ge.PX, ge.BY + 80]);
  let kW, kE;
  const setLevel = v => { W_.set = E_.set = v; };   // en volts
  kW = Sim.knob(document.getElementById('perillaW'), {
    min: 0, max: VMAX * KPA_PER_V, step: 5, value: W_.set * KPA_PER_V, label: 'Presión de la bomba',
    format: v => v + ' kPa', onInput: v => { setLevel(v / KPA_PER_V); if (kE) kE.set(v / KPA_PER_V, true); }
  });
  kE = Sim.knob(document.getElementById('perillaE'), {
    min: 0, max: VMAX, step: 0.5, value: E_.set, label: 'Voltaje de la fuente',
    format: v => fmt(v) + ' V', onInput: v => { setLevel(v); if (kW) kW.set(v * KPA_PER_V, true); }
  });
  const inercia = document.getElementById('inercia'), oIn = document.getElementById('oInercia');
  const setTau = () => { tau = +inercia.value; oIn.textContent = tau ? fmt(tau) + ' s' : 'sin'; };
  inercia.addEventListener('input', setTau); setTau();

  // ---------- física ----------
  function step(s, dt) {
    // La inercia es el tiempo que tarda todo en arrancar o detenerse por completo.
    s.v = s.level.step(s.on ? s.set : 0, tau, dt);
    s.i = s.v / R * 1000;                                       // mA
    const tn = Math.min(0.15, tau * 0.15);                      // las agujas apenas se atrasan
    s.nV.step(s.v / VMAX, tn, dt);
    s.nI.step(s.i / IFULL, tn, dt);
    s.rpm = s.i * RPM_PER_MA;
    s.nS.step(s.rpm / (IFULL * RPM_PER_MA), tn, dt);
    s.omega = -s.rpm / 60 * 2 * Math.PI;              // rad/s, a la velocidad real
    s.rotor += s.omega * dt;
    s.phase += s.i * 12 * dt;
  }

  // Caja del controlador con su nombre y la escala de la perilla.
  function controllerBox(ctx, g, title, fill, scale, knobLabel) {
    ctx.fillStyle = C.ink; ctx.fillRect(g.PX - 14, g.BOT + 30, 28, 18);       // cuello hacia el circuito
    D.roundRect(ctx, g.BX, g.BY, g.BW, g.BH, 14, fill, C.ink, 2.5);
    D.text(ctx, title, g.BX + 18, g.BY + 24, C.ink, { align: 'left', size: 15 });
    D.knobScale(ctx, g.PX, g.BY + 80, 36, scale);
    D.text(ctx, knobLabel, g.PX, g.BY + 138, C.muted, { size: 14 });
  }

  // ---------- dibujo del agua ----------
  function drawWater() {
    const g = gw, s = W_, ctx = pw.begin();
    D.pipe(ctx, g.loop);
    D.line(ctx, [[g.X0, g.MIDY], [110, g.MIDY]], 14, C.pipe, 'butt');   // toma del manómetro
    D.line(ctx, [[g.X0, g.MIDY], [110, g.MIDY]], 6, C['water-soft'], 'butt');
    D.narrow(ctx, g.PX, g.TOP, hn);
    water.draw(ctx);
    D.text(ctx, 'tramo angosto', g.PX, g.TOP + 38, C.muted, { size: 15 });
    D.speedLegend(ctx, 600, 46, 160);

    controllerBox(ctx, g, 'BOMBA', C.metal, [['0', 0], ['60', 0.5], ['120', 1]], 'presión (kPa)');
    D.meter(ctx, g.BX + g.BW - 70, g.BY + 52, { r: 30, frac: s.nS.x, color: C.water, lcdW: 104,
      text: digits(s.rpm, 4, 0), unit: 'rpm' });
    D.led(ctx, g.BX + 108, g.BY + 92, s.v > 0.05 ? 1 : 0);   // detecta presión desde 0.5 kPa
    // rotor dentro de la tubería
    D.circle(ctx, g.PX, g.BOT, 40, C.metal, C.ink, 2.5);
    D.circle(ctx, g.PX, g.BOT, 33, C['water-soft']);
    D.rotor(ctx, g.PX, g.BOT, 27, s.rotor, s.omega, 4, C.water);
    D.circle(ctx, g.PX, g.BOT, 6, C.ink);

    D.meter(ctx, 70, g.MIDY - 20, { frac: s.nV.x, color: C.water, lcdW: 104, label: 'presión',
      text: digits(s.v * KPA_PER_V, 3, 1), unit: 'kPa' });
    D.meter(ctx, g.X1, g.MIDY, { frac: s.nI.x, color: C.water, lcd: 'right', lcdW: 100, label: 'caudal',
      text: digits(s.i * MLS_PER_MA, 3, 1), unit: 'mL/s' });
  }

  // ---------- dibujo eléctrico ----------
  function drawElectric() {
    const g = ge, s = E_, ctx = pe.begin(), PX = g.PX, BOT = g.BOT;
    D.wire(ctx, g.loop);
    D.line(ctx, [[g.X0, g.MIDY], [110, g.MIDY]], 2.5, C.muted);
    D.flow(ctx, g.loop, s.phase, C.charge, { gap: 30, r: 4.5 });
    D.resistor(ctx, PX, g.TOP);
    D.text(ctx, '1 kΩ', PX, g.TOP + 34, C.muted, { size: 15 });
    D.text(ctx, 'resistencia', PX, g.TOP - 30, C.muted, { size: 14, weight: 400 });

    controllerBox(ctx, g, 'FUENTE', C['charge-soft'], [['0', 0], ['6', 0.5], ['12', 1]], 'voltaje (V)');
    D.meter(ctx, g.BX + g.BW - 70, g.BY + 52, { r: 30, frac: s.nV.x, color: C.charge, lcdW: 104,
      text: digits(s.v, 2, 2), unit: 'V' });
    D.led(ctx, g.BX + 108, g.BY + 92, s.v > 0.05 ? 1 : 0);   // detecta presión desde 0.5 kPa
    // símbolo de la fuente: placa larga (+) a la izquierda, la corriente sale hacia la izquierda
    ctx.fillStyle = C.card; ctx.fillRect(PX - 22, BOT - 26, 44, 52);
    D.line(ctx, [[PX - 22, BOT], [PX - 9, BOT]], 4, C.ink); D.line(ctx, [[PX + 9, BOT], [PX + 22, BOT]], 4, C.ink);
    D.line(ctx, [[PX - 9, BOT - 24], [PX - 9, BOT + 24]], 4, C.ink, 'butt');
    D.line(ctx, [[PX + 9, BOT - 12], [PX + 9, BOT + 12]], 9, C.ink, 'butt');
    D.text(ctx, '+', PX - 26, BOT - 30, C.ink, { size: 20 });

    D.meter(ctx, 70, g.MIDY - 20, { frac: s.nV.x, color: C.charge, lcdW: 104, label: 'voltímetro',
      text: digits(s.v, 2, 2), unit: 'V' });
    D.meter(ctx, g.X1, g.MIDY, { frac: s.nI.x, color: C.charge, lcd: 'right', lcdW: 100, label: 'amperímetro',
      text: digits(s.i, 2, 2), unit: 'mA' });
  }

  Sim.run(dt => {
    step(W_, dt); step(E_, dt);
    water.step(W_.i * 12, dt);
    drawWater(); drawElectric();
  });
})();
</script>
</body>
</html>
