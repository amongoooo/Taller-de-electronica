<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Resistencia · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261025073939">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Resistencia</h1>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Una bomba y un tramo angosto de tubería en una vuelta; el tramo se hace más largo o más corto, más angosto o más ancho, y cambia cuánta agua pasa"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Una pila y una barra de carbón (la resistencia) en una vuelta; la barra se hace más larga o más corta, más delgada o más gruesa, y cambian la corriente y el calor"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261025073939"></script>
<script>
(() => {
  const { C, draw: D, fmt } = Sim;
  // Una pila (en el agua, una bomba) y una resistencia: una barra de carbón (en el agua, un tramo angosto) que en su
  // tarjeta se hace más larga o más corta y más delgada o más gruesa. Su resistencia crece con el largo y baja con
  // el área: R = 1 kΩ × (largo / 2 cm) / (área / área de la delgada); la media tiene el doble de área y la gruesa el
  // cuádruple. Con el mismo voltaje, más resistencia deja pasar menos corriente (I = V / R) y lo que pasa la calienta
  // (P = V × I): con 12 V y la más corta y gruesa (250 Ω) recibe 0,58 W y llega a unos 100 °C; es de 1 W, no se quema.
  const VALUES = [0, 1.5, 3, 4.5, 6, 9, 12], LENS = [2, 4, 6, 8], AREAS = [1, 2, 4], IMAX = 48, VMAX = 12;
  const AREA_NAME = { 1: ['delgada', 'angosto'], 2: ['media', 'medio'], 4: ['gruesa', 'ancho'] };
  const st = { V: 9, len: 4, area: 2, I: Sim.ramp(), phase: 0, rotor: 0 };
  const heat = Sim.heat({ pMax: 1, tMax: 155, tau: 4 });
  const R = () => 1000 * (st.len / 2) / st.area;
  const unit = w => w ? ' psi' : ' V';
  const valText = (v, w) => fmt(v, v % 1 ? 1 : 0) + unit(w);
  const rate = (I, w) => fmt(Math.abs(I) < 0.005 ? 0 : I, 2) + (w ? ' mL/s' : ' mA');

  // ---------- paneles ----------
  // Ancho fijo y alto según la caja; en una caja alta (el celular vertical) el dibujo es más angosto y más alto.
  const fit = (w, h) => h / w > 1.25 ? [540, Math.round(Math.max(760, Math.min(1150, 540 * h / w))), 0, 'v']
    : [820, Math.round(Math.max(470, Math.min(1000, 820 * h / w))), 0, 'h'];
  const panels = { w: Sim.panel(document.getElementById('pw'), fit), e: Sim.panel(document.getElementById('pe'), fit) };
  panels.w.mirror = panels.e; panels.e.mirror = panels.w;
  Sim.viewSwitch();
  const geo = p => {
    const v = p.mode === 'v', X0 = v ? 110 : 170, X1 = v ? 430 : 650, TOP = v ? 230 : 170, BOT = p.H - 70;
    return { v, X0, X1, XR: (X0 + X1) / 2, TOP, BOT, MID: (TOP + BOT) / 2, loop: D.rect(X0, TOP, X1, BOT) };
  };
  // La barra (el tramo): 30 del dibujo por cm de largo, y su medio grueso según el área (en el agua, el medio ancho
  // por dentro: el área de la tubería crece con su cuadrado).
  const span = () => 30 * st.len;
  const halfW = () => 4 * Math.sqrt(st.area);
  const halfE = () => 5 * Math.sqrt(st.area);

  // Voltaje (presión) en un punto: del + de la pila a la barra el de la pila; en la barra baja parejo; después 0.
  Sim.field = (x, y) => {
    const g = geo(panels.e), a = g.XR - span() / 2;
    let v = 0;
    if (x < g.X0 + 2) v = y < g.MID ? st.V : 0;
    else if (y < g.MID) v = st.V * (1 - Math.max(0, Math.min(1, (x - a) / span())));
    return [v / VMAX, Math.abs(st.I.x) / IMAX];
  };
  const syncColors = Sim.colorPicker(panels, { top: true, spot: side => [panels[side].W - 6, 2], ends: side => {
    const w = side === 'w';
    return ({ v: ['lento', 'rápido'], p: ['0' + unit(w), VMAX + unit(w)], q: ['0', IMAX + (w ? ' mL/s' : ' mA')] })[Sim.shownColorMode()];
  } });

  // El agua: una vuelta con el tramo angosto arriba (con una entrada y una salida de 14 de largo).
  let water = null, waterLoop = '';
  const profile = g => {
    const d0 = (g.BOT - g.TOP) + (g.XR - span() / 2 - g.X0), d1 = d0 + span(), h = halfW(), R0 = 14;
    return d => d < d0 - R0 || d > d1 + R0 ? Sim.PIPE : d < d0 ? h + (Sim.PIPE - h) * (d0 - d) / R0 : d > d1 ? h + (Sim.PIPE - h) * (d - d1) / R0 : h;
  };
  const waterFor = g => {
    const key = g.loop.join();
    if (key !== waterLoop) { waterLoop = key; water = Sim.water(g.loop, profile(g)); }
    return water;
  };
  const reshape = () => { if (water) water.setProfile(profile(geo(panels.w))); };

  // ---------- la pila (bomba) y la resistencia ----------
  // Tocarlas abre su tarjeta; la rueda del ratón cambia el voltaje de la pila y el largo de la barra.
  const parts = {
    v: { pos: g => [g.X0, g.MID], label: side => side === 'w' ? 'Bomba' : 'Pila',
      wheel: f => { const i = VALUES.indexOf(st.V) + f; if (i >= 0 && i < VALUES.length) setV(VALUES[i]); },
      menu: side => ({ title: side === 'w' ? 'Bomba' : 'Pila', rows: [{ label: side === 'w' ? 'Presión' : 'Voltaje', values: VALUES, get: () => st.V, set: setV, format: v => valText(v, side === 'w') }] }) },
    r: { pos: g => [g.XR, g.TOP], label: side => side === 'w' ? 'Tramo angosto' : 'Resistencia',
      wheel: f => { const i = LENS.indexOf(st.len) + f; if (i >= 0 && i < LENS.length) setLen(LENS[i]); },
      menu: side => ({ title: () => (side === 'w' ? 'Tramo angosto ' : 'Resistencia ') + Sim.ohm(R()), rows: [
        { label: 'Largo', seg: LENS.map(n => ({ value: n, text: n + ' cm' })), get: () => st.len, set: setLen },
        { label: side === 'w' ? 'Ancho' : 'Grosor', seg: AREAS.map(a => ({ value: a, text: AREA_NAME[a][side === 'w' ? 1 : 0] })), get: () => st.area, set: setArea },
        Sim.powerRow(heat, side)] }) }
  };
  function setV(v) { st.V = v; }
  function setLen(n) { st.len = n; reshape(); }
  function setArea(a) { st.area = a; reshape(); }
  for (const k in parts) {
    const pt = parts[k];
    pt.els = {};
    for (const side of ['w', 'e']) {
      const p = panels[side], el = document.createElement('button');
      el.type = 'button'; el.className = 'sim-hit';
      el.setAttribute('aria-label', pt.label(side)); el.setAttribute('aria-haspopup', 'dialog');
      p.box.querySelector('.sim-layer').appendChild(el);
      p.at(el, () => pt.pos(geo(p)));
      el.addEventListener('click', () => Sim.menu.toggle(el, pt.menu(side)));
      el.addEventListener('wheel', e => { e.preventDefault(); pt.wheel(e.deltaY < 0 ? 1 : -1); }, { passive: false });
      pt.els[side] = el;
    }
    pt.open = () => Sim.menu.isOpen(pt.els.w) || Sim.menu.isOpen(pt.els.e);
    if (Sim.side) Sim.side.part({ anchor: () => pt.els[Sim.view === 'w' ? 'w' : 'e'], menu: () => pt.menu(Sim.view === 'w' ? 'w' : 'e') });
  }

  // ---------- dibujo ----------
  const battery = (ctx, x, y) => {
    ctx.fillStyle = C.card; ctx.fillRect(x - 28, y - 24, 56, 48);
    D.line(ctx, [[x, y - 24], [x, y - 9]], 4, C.ink); D.line(ctx, [[x, y + 9], [x, y + 24]], 4, C.ink);
    D.line(ctx, [[x - 24, y - 9], [x + 24, y - 9]], 4, C.ink, 'butt');
    D.line(ctx, [[x - 12, y + 9], [x + 12, y + 9]], 9, C.ink, 'butt');
    D.text(ctx, '+', x - 30, y - 22, C.ink, { size: 20 });
  };
  // El tramo angosto, de x0 a x1, con medio ancho h por dentro y su entrada y su salida.
  const narrowSpan = (ctx, x0, x1, y, h) => {
    const h0 = Sim.PIPE, R0 = 14;
    const shape = (hf, hh, col) => {
      ctx.beginPath();
      ctx.moveTo(x0 - R0, y - hf); ctx.lineTo(x0, y - hh); ctx.lineTo(x1, y - hh); ctx.lineTo(x1 + R0, y - hf);
      ctx.lineTo(x1 + R0, y + hf); ctx.lineTo(x1, y + hh); ctx.lineTo(x0, y + hh); ctx.lineTo(x0 - R0, y + hf);
      ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    };
    ctx.fillStyle = C.card; ctx.fillRect(x0 - R0 - 1, y - h0 - 6, x1 - x0 + 2 * R0 + 2, 2 * h0 + 12);
    shape(h0 + 5, h + 5, C.pipe);
    shape(h0, h, C['water-soft']);
  };
  // Calor: un brillo naranja a lo largo de la barra (o del tramo), según qué tan caliente está.
  const glow = (ctx, x0, x1, y) => {
    const k = Math.min(1, heat.f * 1.6);
    if (k < 0.04) return;
    for (let x = x0 + 15; x <= x1 - 15 + 0.1; x += Math.max(15, (x1 - x0 - 30) / Math.max(1, Math.round((x1 - x0 - 30) / 30)))) D.heatGlow(ctx, x, y, k, 34);
  };

  function draw(side) {
    const p = panels[side], w = side === 'w', g = geo(p), ctx = p.begin(), I = st.I.x;
    const x0 = g.XR - span() / 2, x1 = g.XR + span() / 2;
    if (w) {
      D.pipe(ctx, g.loop);
      glow(ctx, x0, x1, g.TOP);
      narrowSpan(ctx, x0, x1, g.TOP, halfW());
      waterFor(g).draw(ctx);
      D.pump(ctx, g.X0, g.MID, st.rotor, I * 100 * Math.PI / 30);
    } else {
      D.wire(ctx, g.loop);
      D.flow(ctx, g.loop, st.phase, C.charge, { gap: 30, r: 4.5 });
      ctx.fillStyle = C.card; ctx.fillRect(x0 - 2, g.TOP - 16, x1 - x0 + 4, 32);
      D.line(ctx, [[x0 - 2, g.TOP], [x1 + 2, g.TOP]], 4, C.ink);
      glow(ctx, x0, x1, g.TOP);
      const h = halfE();
      D.roundRect(ctx, x0, g.TOP - h, x1 - x0, 2 * h, Math.min(h, 4), C.muted, C.ink, 2);
      battery(ctx, g.X0, g.MID);
    }
    // contorno de lo que tiene su tarjeta abierta
    const hb = w ? Sim.PIPE + 10 : 20;
    D.select(ctx, g.X0 - 48, g.MID - 48, 96, 96, Sim.fadeSel(parts.v.els.w, parts.v.open()));
    D.select(ctx, x0 - 22, g.TOP - hb, x1 - x0 + 44, 2 * hb, Sim.fadeSel(parts.r.els.w, parts.r.open()));
    D.tag(ctx, g.X0 + 56, g.MID, w ? 'bomba' : 'pila', valText(st.V, w), { sel: parts.v.open(), align: 'left' });
    D.tag(ctx, g.XR, g.TOP - (w ? Sim.PIPE + 34 : 40), w ? 'tramo angosto' : 'resistencia', Sim.ohm(R()), { sel: parts.r.open() });
    // abajo de la barra: su largo y su grosor, y en la electricidad su temperatura
    const yb = g.TOP + (w ? Sim.PIPE + 30 : 34);
    D.text(ctx, st.len + ' cm · ' + AREA_NAME[st.area][w ? 1 : 0], g.XR, yb, C.muted, { size: 15, bg: true });
    if (!w) {
      const t = Math.round(heat.T) + ' °C', hot = heat.f > 0.15;
      D.text(ctx, t, g.XR, yb + Sim.px(16, ctx) * 1.4, hot ? C.danger : C.muted, { size: 16, font: Sim.MONO, weight: 600, bg: true });
    }
    // lo que pasa, en la subida de la derecha (como un contador fijo)
    const t = rate(I, w), px = D.font(ctx, 16, Sim.MONO, 600), bw = ctx.measureText(t).width + 18, bh = Math.round(px * 1.5);
    const half = w ? Sim.PIPE + 9 : 16, cy = g.MID;
    D.line(ctx, [[g.X1 - half, cy], [g.X1 + half, cy]], 4, C.ok, 'butt');
    D.circle(ctx, g.X1 - half, cy, 4, C.ok); D.circle(ctx, g.X1 + half, cy, 4, C.ok);
    const cx = Math.min(panels.e.W - 4 - bw / 2, g.X1 + half + 8 + bw / 2);
    D.roundRect(ctx, cx - bw / 2, cy - bh / 2, bw, bh, bh / 2, C.card, C.ok, 2);
    D.text(ctx, t, cx, cy + 0.5, C.ok, { size: 16, font: Sim.MONO, weight: 600 });
  }

  // ---------- animación ----------
  let last = performance.now();
  const frame = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const I = st.I.step(st.V / R() * 1000, 0.4, dt);
    heat.step(I * I * R() / 1e6, dt);   // P = I² · R (I en A)
    st.phase += I * 12 * dt;
    if (water) water.step(I * 12, dt);
    st.rotor += I * 100 * Math.PI / 30 * dt;
    Sim.readColors();
    if (panels.w.box.clientWidth) draw('w');
    if (panels.e.box.clientWidth) draw('e');
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  // ---------- pasos ----------
  // 1: más angosta (delgada) deja pasar menos. 2: más larga (6 cm o más) también. 3: se calienta: con más voltaje o
  // menos resistencia la barra pasa de 60 °C.
  const STEPS = ['Más angosto, menos pasa', 'Más largo, menos pasa', 'Se calienta'];
  Sim.steps(STEPS, () => {}, k => k === 0 ? st.area === 1 : k === 1 ? st.len >= 6 : heat.T >= 60);
})();
</script>
</body>
</html>
