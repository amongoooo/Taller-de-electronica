<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carga y descarga RC · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261024023233">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Carga y descarga RC</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Bomba de vaivén que empuja el agua hacia adelante y hacia atrás por un tramo angosto y un tanque con membrana, y un registrador de presión de dos plumas que dibuja la presión en el tiempo"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Generador de funciones con una resistencia y un capacitor a tierra, y un osciloscopio de dos canales que muestra el voltaje en el tiempo"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261024023233"></script>
<script src="../../assets/osciloscopio.js?v=20261024023233"></script>
<script>
// Carga y descarga RC (C2, C3): generador → R → C a tierra. El generador y el osciloscopio están en
// assets/osciloscopio.js.
(() => {
  const { X0, X1, TOP, BOT, XR, XL, PATH } = Sim.scope;
  Sim.scope({
    // C2: cuadrada de 0 a 5 V a 100 Hz, 10 kΩ y 100 nF: τ = R·C = 1 ms, una división. C3: 10 µF y 1 Hz, τ = 0,1 s.
    // El canal 1 ve el capacitor y el canal 2 el generador.
    preset: { wave: 'square', freq: 100, amp: 5, off: 2.5, R: 10000, Cap: 0.1, vd: [1, 2], td: 1, ch2: true, pos: [-2.5, -3.5], trig: { src: 1, level: 2.5 }, probe: [640, 980, 300], side: [1, -1, -1] },
    places: { R: [XR, TOP, 'h'], C: [XL, TOP, 'h'] },
    wires: [{ pts: PATH, seq: ['a', 'R', 'b', 'C', 'g'] }],
    branches: () => [{ pts: Sim.draw.rect(X0, TOP, X1, BOT), br: 's', dc: (BOT - TOP) + (XR - X0) }],
    // El capacitor avanza con la solución exacta de su ecuación (v se acerca a e con τ = R·C:
    // v1 = e + (v0 − e)·e^(−h/τ)), así que vale igual con τ de microsegundos o de segundos. La corriente es la
    // carga que entró al capacitor en el paso.
    solve: (e, h, st) => {
      const Cf = st.Cap * 1e-6, v0 = st.vc, v1 = e + (v0 - e) * Math.exp(-h / (st.R * Cf));
      st.vc = v1;
      const I = Cf * (v1 - v0) / h * 1000;
      return { I, i: { s: I }, v: { a: e, b: v1, g: 0 }, VR: e - v1 };
    },
    ifull: 1, rValues: Sim.series(1000, 10000)
  });
})();
</script>
</body>
</html>
