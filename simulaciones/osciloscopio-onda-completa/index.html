<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rectificador de onda completa · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261022224459">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Rectificador de onda completa</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Bomba de vaivén con un puente de cuatro válvulas de retención que manda el agua siempre en el mismo sentido por un tramo angosto, con un tanque con membrana que se pone en paralelo, y un registrador de presión de dos plumas que dibuja la presión en el tiempo"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Generador de funciones con un puente de cuatro diodos 1N4007 y una resistencia de carga, con un capacitor de filtro que se pone en paralelo, y un osciloscopio de dos canales que muestra el voltaje en el tiempo"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261022224459"></script>
<script src="../../assets/osciloscopio.js?v=20261022224459"></script>
<script>
// Rectificador de onda completa: puente de cuatro 1N4007 entre el generador y la resistencia de carga, con o sin
// el capacitor de filtro en paralelo. El generador y el osciloscopio están en assets/osciloscopio.js.
//
//   A (borne +) ──D1→── P ──←D2── B (borne −)      arriba: D1 y D2 llegan a P
//                       │ C  │ R
//   A ────────←D3── N ──────────D4→── B            abajo: D3 y D4 salen de N
//
// En el semiciclo positivo conducen D1 y D4; en el negativo, D2 y D3. Por la carga la corriente va siempre de
// P a N, y en ella caen 2 × 0,7 V menos que la entrada.
(() => {
  const { X0, X1, TOP, BOT, PATH, VF, RD, rcOf } = Sim.scope;
  const YN = 210, MN = (TOP + YN) / 2;   // cable de N (adentro del circuito) y la mitad entre él y el de arriba
  const XA = 180, XB = 460, XC = 280, XRr = 360;   // diodos de la izquierda y de la derecha; capacitor; resistencia
  Sim.scope({
    // Senoidal de 10 Vpp (5 Vp) a 100 Hz y 1 kΩ: el canal 1 ve la salida (P) contra N, de 3,6 Vp, con dos jorobas por
    // ciclo. El caimán de tierra va en N: la salida no comparte tierra con el generador.
    preset: { wave: 'sine', freq: 100, amp: 10, off: 0, R: 1000, Cap: 100, filt: false, vd: [1, 2], td: 2.5, ch2: false, pos: [-2, 0], trig: { level: 1.8 },
      probe: [720, 372 - X0, 300], pw: [0, 1, 0], side: [1, 1, -1] },
    places: {
      R: [XRr, MN, 'v', { tag: 'right', lim: () => X1 - 16 }],
      C: [XC, MN, 'v', { lim: () => X0 + 16 }],
      D1: [XA, TOP, 'h', { ref: 'D1', turn: false }],
      D2: [XB, TOP, 'h', { ref: 'D2', dir: -1, turn: false }],
      D3: [XA, YN, 'h', { ref: 'D3', dir: -1, turn: false, tag: 'below' }],
      D4: [XB, YN, 'h', { ref: 'D4', turn: false, tag: 'below' }]
    },
    wires: [{ pts: PATH, seq: ['A', 'D1', 'P', 'D2', 'B'] },
      { pts: [[X0, YN], [X1, YN]], seq: ['A', 'D3', 'N', 'D4', 'B'] },
      { pts: [[XRr, TOP], [XRr, YN]], seq: ['P', 'R', 'N'], probe: false },
      { pts: [[XC, TOP], [XC, YN]], seq: ['P', 'C', 'N'], probe: false, when: st => st.filt, half: { C: st => rcOf(st.Cap) } }],
    // Cada tramo entre dos uniones con su corriente: la del generador (s), la de cada diodo, la de la resistencia
    // (r), la del capacitor (c) y los pedazos de P (p) y de N (n) entre el capacitor y la resistencia.
    branches: st => [{ pts: [[X1, YN], [X1, BOT], [X0, BOT], [X0, YN]], br: 's' },
      { pts: [[X0, YN], [X0, TOP], [XC, TOP]], br: 'a1' },
      { pts: [[XC, TOP], [XRr, TOP]], br: 'p' },
      { pts: [[X1, YN], [X1, TOP], [XRr, TOP]], br: 'b2' },
      { pts: [[XRr, TOP], [XRr, YN]], br: 'r', dc: MN - TOP },
      { pts: [[XC, YN], [X0, YN]], br: 'a3' },
      { pts: [[XC, YN], [XRr, YN]], br: 'n' },
      { pts: [[XRr, YN], [X1, YN]], br: 'b4' },
      ...(st.filt ? [{ pts: [[XC, TOP], [XC, YN]], br: 'c' }] : [])],
    dots: st => [[X0, YN], [X1, YN], [XRr, TOP], [XRr, YN], ...(st.filt ? [[XC, TOP], [XC, YN]] : [])],
    // Voltajes contra el borne − del generador (B = 0, A = e). Conduce un par cuando la entrada pasa de lo que
    // tiene la salida más 2 × 0,7 V. Sin capacitor la salida es |e| − 1,4 V (y 0 si no llega); con él, sigue a
    // |e| − 1,4 V mientras conduce y, si no, se descarga por R (τ = R·C): el rizado, ahora dos veces por ciclo.
    // Mientras no conduce ningún par, P y N quedan sueltos del generador: a la mitad, con la salida entre ellos.
    solve: (e, h, st) => {
      const R = st.R, ae = Math.abs(e), s = e < 0 ? -1 : 1, R2 = 2 * RD;
      let out, iR, iC = 0, on;
      if (!st.filt) {
        on = ae > 2 * VF;
        out = on ? (ae - 2 * VF) * R / (R + R2) : 0;
        iR = out / R * 1000;
      } else {
        const Cf = st.Cap * 1e-6, v0 = st.vc;
        on = ae - v0 > 2 * VF;
        const vi = on ? (ae - 2 * VF) * R / (R + R2) : 0, tau = on ? Cf * R * R2 / (R + R2) : R * Cf;
        const x = Math.exp(-h / tau);
        out = vi + (v0 - vi) * x; st.vc = out;
        iR = (vi * h + (v0 - vi) * tau * (1 - x)) / h / R * 1000; iC = Cf * (out - v0) / h * 1000;
      }
      const I = iR + iC, vd = VF + I / 1000 * RD;
      const [vP, vN] = !on ? [(e + out) / 2, (e - out) / 2] : s > 0 ? [vd + out, vd] : [-vd, -vd - out];
      const f = on && s > 0 ? I : 0, b = on && s < 0 ? I : 0;   // por D1 y D4; por D2 y D3
      return { I: s * I, i: { s: s * I, a1: f, b4: f, b2: b, a3: b, r: iR, c: iC, p: f - iC, n: iC - b },
        v: { A: e, B: 0, P: vP, N: vN }, VR: out,
        diodes: { D1: [e - vP, f], D2: [-vP, b], D3: [vN - e, b], D4: [vN, f] } };
    },
    ifull: 5, rValues: Sim.series(1000, 10000), filter: true
  });
})();
</script>
</body>
</html>
