<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEDs en serie y paralelo · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261026212916">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>LEDs en serie y paralelo</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="0">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua con dos ruedas de molino en serie o en paralelo"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico con dos LEDs en serie o en paralelo"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261026212916"></script>
<script src="../../assets/banco.js?v=20261026212916"></script>
<script>
(() => {
  const { C, draw: D } = Sim;
  // Cada resistencia (470 Ω al empezar) y cada LED (rojo, unos 2 V para empezar a moverse) se cambian
  // tocándolos: se abre su menú. En serie solo está la primera resistencia.
  const RMIN = 220, RMAX = 4700, HMIN = 3, HMAX = Sim.PIPE - 3, LN = Math.log(RMAX / RMIN);
  const RVALUES = Sim.series(RMIN, RMAX);
  const half = R => HMAX - (HMAX - HMIN) * Math.log(R / RMIN) / LN;
  const fromHalf = h => Sim.nearest(RVALUES, RMIN * Math.exp((HMAX - Math.max(HMIN, Math.min(HMAX, h))) / (HMAX - HMIN) * LN));
  const ohm = Sim.ohm;
  const XR = 260;                 // posición de las resistencias
  const st = { mode: 'serie', R: [470, 470], led: ['rojo', 'rojo'], broken: [false, false], rb: [false, false], burnT: [9, 9], ang: [0, 0], om: [0, 0] };
  const sides = {};
  const vf = k => Sim.led(st.led[k]).vf;
  // Cada LED y cada resistencia se calienta (Sim.heat) y su menú lo muestra: el LED aguanta Vf · 30 mA y se
  // quema si se pasa; la resistencia, ¼ W (quemada, o reventada en el agua, abre su rama).
  const lh = [0, 1].map(k => Sim.heat({ ...Sim.HEAT.led, pMax: () => vf(k) * Sim.LED_IMAX / 1000 }));
  const rh = [0, 1].map(() => Sim.heat(Sim.HEAT.res));

  // Recorridos de cada modo. En paralelo hay un tronco común (abajo) y dos ramas: A arriba y B a media altura.
  function layout(g) {
    const YB = g.TOP + 0.5 * (g.BOT - g.TOP);
    const s = sides[g.side] = { g, YB, phase: { loop: 0, trunk: 0, a: 0, b: 0 } };
    s.paths = {
      loop: g.loop,
      trunk: [[g.X1, YB], [g.X1, g.BOT], [g.X0, g.BOT], [g.X0, YB]],
      a: [[g.X0, YB], [g.X0, g.TOP], [g.X1, g.TOP], [g.X1, YB]],
      b: [[g.X0, YB], [g.X1, YB]]
    };
    if (g.side === 'w') {
      s.water = { loop: Sim.water(s.paths.loop), trunk: Sim.water(s.paths.trunk), a: Sim.water(s.paths.a), b: Sim.water(s.paths.b) };
      profiles();
    }
  }
  // Perfil del agua según el ancho de cada tramo angosto.
  function profiles() {
    const s = sides.w, g = s.g, N = (dc, k) => Sim.narrowProfile(dc, half(st.R[k]));
    s.water.loop.setProfile(N((g.BOT - g.TOP) + (XR - g.X0), 0));
    s.water.a.setProfile(N((s.YB - g.TOP) + (XR - g.X0), 0));
    s.water.b.setProfile(N(XR - g.X0, 1));
  }
  const rPos = (g, k) => [XR, k ? sides[g.side].YB : g.TOP];
  // Dónde va cada LED (rueda) en el modo actual.
  const ledPos = (g, k) => {
    const s = sides[g.side];
    if (st.mode === 'serie') return [k ? 545 : 420, g.TOP];
    return [470, k ? s.YB : g.TOP];
  };

  const b = Sim.bench({
    iFull: 30, v0: 9, nodes: false,
    layout,
    model(V) {
      const [b1, b2] = [0, 1].map(k => st.broken[k] || st.rb[k]);
      if (st.mode === 'serie') {
        const I = (st.broken[0] || st.broken[1] || st.rb[0]) ? 0 : Math.max(0, V - vf(0) - vf(1)) / st.R[0] * 1000;
        return { I, branch: [I, I] };
      }
      const I1 = b1 ? 0 : Math.max(0, V - vf(0)) / st.R[0] * 1000, I2 = b2 ? 0 : Math.max(0, V - vf(1)) / st.R[1] * 1000;
      return { I: I1 + I2, branch: [I1, I2] };
    },
    // Cómo se reparte el voltaje: un LED roto (o todos, si no alcanza para encenderlos) se queda con él.
    circuit(g, m, V) {
      const [b1, b2] = st.broken;
      const R = (x, y, dV, k = 0) => ({ at: [x, y], half: 46, dV, R: st.rb[k] ? Infinity : st.R[k], pr: pinch[k] });
      const L = (x, y, dV, i = 0) => ({ at: [x, y], half: 30, dV, pr: ledParts[i], ext: w => w ? 46 : 28 });
      if (st.mode === 'serie') {
        const n = st.rb[0] ? 0 : b1 + b2, on = m.I > 0;
        const led = k => st.rb[0] ? 0 : n ? (st.broken[k] ? V / n : 0) : on ? vf(k) : V / 2;
        return [{ pts: b.loopPts(g), I: m.I, v0: V,
          comps: [R(XR, g.TOP, st.rb[0] ? V : on ? V - vf(0) - vf(1) : 0), L(420, g.TOP, led(0), 0), L(545, g.TOP, led(1), 1)] }];
      }
      const YB = sides.e.YB;
      const branch = (i, pts, y) => {
        const on = m.branch[i] > 0;
        const open = st.rb[i];   // la resistencia quemada se queda con todo el voltaje
        return { pts, I: m.branch[i], v0: V, comps: [R(XR, y, open ? V : on ? V - vf(i) : 0, i), L(470, y, open ? 0 : on ? vf(i) : V, i)] };
      };
      return [
        { pts: [[g.X1, YB], [g.X1, g.BOT], [g.PX + b.SRC, g.BOT]], I: m.I, v0: 0, comps: [] },
        { pts: [[g.PX - b.SRC, g.BOT], [g.X0, g.BOT], [g.X0, YB]], I: m.I, v0: V, comps: [] },
        branch(0, sides.e.paths.a, g.TOP),
        branch(1, sides.e.paths.b, YB)
      ];
    },
    step(dt, m) {
      const k = 6, w = sides.w, e = sides.e;
      if (st.mode === 'serie') {
        w.water.loop.step(b.flowI(m) * k, dt); e.phase.loop += b.flowI(m) * k * dt;
      } else {
        w.water.trunk.step(b.flowI(m) * k, dt); e.phase.trunk += b.flowI(m) * k * dt;
        w.water.a.step(m.branch[0] * k, dt); e.phase.a += m.branch[0] * k * dt;
        w.water.b.step(m.branch[1] * k, dt); e.phase.b += m.branch[1] * k * dt;
      }
      // calor: el LED con Vf · I, la resistencia con I²·R (en serie la segunda no está)
      for (let i = 0; i < 2; i++) {
        const I = st.mode === 'serie' && i ? 0 : m.branch[i] / 1000;
        if (lh[i].step(st.broken[i] ? 0 : vf(i) * m.branch[i] / 1000, dt) && !st.broken[i]) { st.broken[i] = true; b.halt(); b.refresh(); }
        if (rh[i].step(st.rb[i] ? 0 : I * I * st.R[i], dt) && !st.rb[i]) { st.rb[i] = true; st.burnT[i] = 0; b.halt(); b.refresh(); }
        st.burnT[i] += dt;
      }
      for (let i = 0; i < 2; i++) {
        st.om[i] = st.broken[i] ? 0 : -m.branch[i] * Sim.WHEEL_RPM_PER_MA / 60 * 2 * Math.PI;
        st.ang[i] += st.om[i] * dt;
      }
    },
    drawW(ctx, g, m) {
      const s = sides.w, keys = st.mode === 'serie' ? ['loop'] : ['trunk', 'a', 'b'];
      keys.forEach(k => D.pipe(ctx, s.paths[k]));
      const rs = st.mode === 'serie' ? [0] : [0, 1];
      rs.forEach(k => D.narrow(ctx, XR, rPos(g, k)[1], half(st.R[k])));
      keys.forEach(k => s.water[k].draw(ctx));
      rs.forEach(k => D.burstPipe(ctx, XR, rPos(g, k)[1], half(st.R[k]), st.burnT[k], st.rb[k], rh[k].glow, ''));
      rs.forEach(k => b.grips(ctx, XR, rPos(g, k)[1], half(st.R[k]) + 5, pinch[k]));
      [0, 1].forEach(i => {
        const [x, y] = ledPos(g, i);
        if (!st.broken[i]) D.heatGlow(ctx, x, y, lh[i].glow, 46);
        D.wheel(ctx, x, y, { angle: st.ang[i], omega: st.om[i], broken: st.broken[i], tint: `rgb(${Sim.led(st.led[i]).rgb})`, tag: false });
      });
      tags(ctx, g, true);
    },
    drawE(ctx, g, m) {
      const s = sides.e, keys = st.mode === 'serie' ? ['loop'] : ['trunk', 'a', 'b'];
      keys.forEach(k => D.wire(ctx, s.paths[k]));
      keys.forEach(k => D.flow(ctx, s.paths[k], s.phase[k], C.charge, { gap: 30, r: 4.5 }));
      (st.mode === 'serie' ? [0] : [0, 1]).forEach(k => {
        const y = rPos(g, k)[1];
        if (!st.rb[k]) D.heatGlow(ctx, XR, y, rh[k].glow);
        D.resistor(ctx, XR, y);
        if (st.rb[k]) D.burntResistor(ctx, XR, y, st.burnT[k], '');
        b.grips(ctx, XR, y, half(st.R[k]) + 5, pinch[k]);
      });
      [0, 1].forEach(i => {
        const [x, y] = ledPos(g, i);
        if (!st.broken[i]) D.heatGlow(ctx, x, y, lh[i].glow, 56);
        D.ledSymbol(ctx, x, y, { I: m.branch[i], broken: st.broken[i], rgb: Sim.led(st.led[i]).rgb, tag: false });
      });
      tags(ctx, g, false);
    }
  });
  // Etiquetas en una línea arriba de cada componente («nombre valor» y su estado en una pastilla), las de un
  // mismo cable a la misma altura: en el agua más arriba, sobre la flecha de la rueda.
  const rTag = (w, k) => ['R' + (k + 1), ohm(st.R[k]), st.rb[k], st.rb[k] ? (w ? 'reventado' : 'quemada') : ''];
  const ledTag = (w, i) => [(w ? 'rueda ' : 'LED ') + (i + 1), w ? st.led[i].replace(/o$/, 'a') : st.led[i], st.broken[i], st.broken[i] ? (w ? 'rota' : 'quemado') : ''];
  function tags(ctx, g, w) {
    const rows = st.mode === 'serie' ? [[0, 1]] : [[0], [1]];
    rows.forEach(ls => {
      const k = ls.length > 1 ? 0 : ls[0], y = rPos(g, k)[1] - (w ? 68 : 44);
      b.tagRow(ctx, g, y, [[rTag(w, k), XR, pinch[k]], ...ls.map(i => [ledTag(w, i), ledPos(g, i)[0], ledParts[i]])]
        .map(([t, x, pr]) => ({ x, pr, name: t[0], value: t[1], danger: t[2], state: t[3] })));
    });
  }

  // Tocar una rueda (o un LED) abre su menú: su color, y romperlo o repararlo.
  const ledParts = [0, 1].map(i => b.part({
    pos: g => ledPos(g, i),
    label: side => (side === 'w' ? 'Rueda ' : 'LED ') + (i + 1),
    menu: Sim.ledMenu({
      name: String(i + 1), get: () => st.led[i], set: id => { st.led[i] = id; }, heat: lh[i], broken: () => st.broken[i],
      actions: side => [{ text: () => (st.broken[i] ? 'Reparar ' : 'Romper ') + (side === 'w' ? 'la rueda' : 'el LED'), danger: true,
        onClick: () => { st.broken[i] = !st.broken[i]; if (st.broken[i]) b.halt(); else lh[i].reset(); } }]
    })
  }));
  // Cada resistencia se ajusta pellizcándola o con su menú (en serie solo está la primera).
  const pinch = [0, 1].map(k => {
    const set = R => { st.R[k] = R; profiles(); };
    return b.pinch({
      pos: g => k && st.mode === 'serie' ? [-999, -999] : rPos(g, k), get: () => st.R[k], half, fromHalf, set,
      label: side => (side === 'w' ? 'Tramo angosto ' : 'Resistencia ') + (k + 1),
      text: ohm,
      menu: Sim.resistorMenu({ name: String(k + 1), values: RVALUES, get: () => st.R[k], set, format: ohm, heat: rh[k], broken: () => st.rb[k],
        actions: side => [{ text: side === 'w' ? 'Poner un tubo nuevo' : 'Poner una resistencia nueva', hidden: () => !st.rb[k], onClick: () => renewR(k) }] })
    });
  });
  function renewR(k) { st.rb[k] = false; rh[k].reset(); st.burnT[k] = 9; }
  // Selector Serie | Paralelo arriba del circuito: al centro en la computadora, a la izquierda en el celular.
  // También va en la sección Armar de los controles.
  b.linkedChoice({
    pos: g => g.mode === 'ancho' ? [g.PX, g.TOP - 104] : [g.X0 + 70, g.TOP - 104], label: 'Conexión', act: 'arm',
    options: [['serie', 'Serie'], ['paralelo', 'Paralelo']],
    get: () => st.mode, set: v => { st.mode = v; }
  });
  b.start();
})();
</script>
</body>
</html>
