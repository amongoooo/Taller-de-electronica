<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEDs en serie y paralelo · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261021063500">
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>LEDs en serie y paralelo</h1>
    <div class="ctl">
      <label for="inercia">Inercia</label>
      <input type="range" id="inercia" min="0" max="3" step="0.1" value="1">
      <output id="oInercia" for="inercia"></output>
    </div>
  </div>

  <main class="sim-stage">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Circuito de agua con dos ruedas de molino en serie o en paralelo"></canvas>
      <div class="sim-layer"></div>
    </div>
    <div class="sim-panel" id="pe">
      <span class="sim-tag e">Electricidad</span>
      <canvas aria-label="Circuito eléctrico con dos LEDs en serie o en paralelo"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261021063500"></script>
<script src="../../assets/banco.js?v=20261021063500"></script>
<script>
(() => {
  const { C, draw: D } = Sim;
  // Cada resistencia (470 Ω al empezar) y cada LED (rojo, unos 2 V para empezar a moverse) se cambian
  // tocándolos: se abre su menú. En serie solo está la primera resistencia.
  const RMIN = 220, RMAX = 4700, HMIN = 3, HMAX = Sim.PIPE - 3, LN = Math.log(RMAX / RMIN);
  const RVALUES = Sim.series(RMIN, RMAX);
  const half = R => HMAX - (HMAX - HMIN) * Math.log(R / RMIN) / LN;
  const fromHalf = h => Sim.nearest(RVALUES, RMIN * Math.exp((HMAX - Math.max(HMIN, Math.min(HMAX, h))) / (HMAX - HMIN) * LN));
  const ohm = R => R >= 1000 ? (R / 1000).toLocaleString('es-MX') + ' kΩ' : R + ' Ω';
  const XR = 260;                 // posición de las resistencias
  const st = { mode: 'serie', R: [470, 470], led: ['rojo', 'rojo'], broken: [false, false], ang: [0, 0], om: [0, 0] };
  const sides = {};
  const vf = k => Sim.led(st.led[k]).vf;

  // Recorridos de cada modo. En paralelo hay un tronco común (abajo) y dos ramas: A arriba y B a media altura.
  function layout(g) {
    const YB = g.TOP + 0.5 * (g.BOT - g.TOP);
    const s = sides[g.side] = { g, YB, phase: { loop: 0, trunk: 0, a: 0, b: 0 } };
    s.paths = {
      loop: g.loop,
      trunk: [[g.X1, YB], [g.X1, g.BOT], [g.X0, g.BOT], [g.X0, YB]],
      a: [[g.X0, YB], [g.X0, g.TOP], [g.X1, g.TOP], [g.X1, YB]],
      b: [[g.X0, YB], [g.X1, YB]]
    };
    if (g.side === 'w') {
      s.water = { loop: Sim.water(s.paths.loop), trunk: Sim.water(s.paths.trunk), a: Sim.water(s.paths.a), b: Sim.water(s.paths.b) };
      profiles();
    }
  }
  // Perfil del agua según el ancho de cada tramo angosto.
  function profiles() {
    const s = sides.w, g = s.g, N = (dc, k) => Sim.narrowProfile(dc, half(st.R[k]));
    s.water.loop.setProfile(N((g.BOT - g.TOP) + (XR - g.X0), 0));
    s.water.a.setProfile(N((s.YB - g.TOP) + (XR - g.X0), 0));
    s.water.b.setProfile(N(XR - g.X0, 1));
  }
  const rPos = (g, k) => [XR, k ? sides[g.side].YB : g.TOP];
  // Dónde va cada LED (rueda) en el modo actual.
  const ledPos = (g, k) => {
    const s = sides[g.side];
    if (st.mode === 'serie') return [k ? 545 : 420, g.TOP];
    return [470, k ? s.YB : g.TOP];
  };

  const b = Sim.bench({
    iFull: 30, v0: 9,
    layout,
    model(V) {
      const [b1, b2] = st.broken;
      if (st.mode === 'serie') {
        const I = (b1 || b2) ? 0 : Math.max(0, V - vf(0) - vf(1)) / st.R[0] * 1000;
        return { I, branch: [I, I] };
      }
      const I1 = b1 ? 0 : Math.max(0, V - vf(0)) / st.R[0] * 1000, I2 = b2 ? 0 : Math.max(0, V - vf(1)) / st.R[1] * 1000;
      return { I: I1 + I2, branch: [I1, I2] };
    },
    // Cómo se reparte el voltaje: un LED roto (o todos, si no alcanza para encenderlos) se queda con él.
    circuit(g, m, V) {
      const [b1, b2] = st.broken, R = (x, y, dV) => ({ at: [x, y], half: 46, dV }), L = (x, y, dV) => ({ at: [x, y], half: 30, dV });
      if (st.mode === 'serie') {
        const n = b1 + b2, on = m.I > 0;
        const led = k => n ? (st.broken[k] ? V / n : 0) : on ? vf(k) : V / 2;
        return [{ pts: b.loopPts(g), I: m.I, v0: V,
          comps: [R(XR, g.TOP, on ? V - vf(0) - vf(1) : 0), L(420, g.TOP, led(0)), L(545, g.TOP, led(1))] }];
      }
      const YB = sides.e.YB;
      const branch = (i, pts, y) => {
        const on = m.branch[i] > 0;
        return { pts, I: m.branch[i], v0: V, comps: [R(XR, y, on ? V - vf(i) : 0), L(470, y, on ? vf(i) : V)] };
      };
      return [
        { pts: [[g.X1, YB], [g.X1, g.BOT], [g.PX + b.SRC, g.BOT]], I: m.I, v0: 0, comps: [] },
        { pts: [[g.PX - b.SRC, g.BOT], [g.X0, g.BOT], [g.X0, YB]], I: m.I, v0: V, comps: [] },
        branch(0, sides.e.paths.a, g.TOP),
        branch(1, sides.e.paths.b, YB)
      ];
    },
    step(dt, m) {
      const k = 6, w = sides.w, e = sides.e;
      if (st.mode === 'serie') {
        w.water.loop.step(m.I * k, dt); e.phase.loop += m.I * k * dt;
      } else {
        w.water.trunk.step(m.I * k, dt); e.phase.trunk += m.I * k * dt;
        w.water.a.step(m.branch[0] * k, dt); e.phase.a += m.branch[0] * k * dt;
        w.water.b.step(m.branch[1] * k, dt); e.phase.b += m.branch[1] * k * dt;
      }
      for (let i = 0; i < 2; i++) {
        st.om[i] = st.broken[i] ? 0 : -m.branch[i] * Sim.WHEEL_RPM_PER_MA / 60 * 2 * Math.PI;
        st.ang[i] += st.om[i] * dt;
      }
    },
    drawW(ctx, g, m) {
      const s = sides.w, keys = st.mode === 'serie' ? ['loop'] : ['trunk', 'a', 'b'];
      keys.forEach(k => D.pipe(ctx, s.paths[k]));
      const rs = st.mode === 'serie' ? [0] : [0, 1];
      rs.forEach(k => D.narrow(ctx, XR, rPos(g, k)[1], half(st.R[k])));
      keys.forEach(k => s.water[k].draw(ctx));
      rs.forEach(k => b.grips(ctx, XR, rPos(g, k)[1], half(st.R[k]) + 5, pinch[k]));
      [0, 1].forEach(i => {
        const [x, y] = ledPos(g, i);
        D.wheel(ctx, x, y, { angle: st.ang[i], omega: st.om[i], broken: st.broken[i], label: 'rueda ' + (i + 1), tint: `rgb(${Sim.led(st.led[i]).rgb})` });
      });
    },
    drawE(ctx, g, m) {
      const s = sides.e, keys = st.mode === 'serie' ? ['loop'] : ['trunk', 'a', 'b'];
      keys.forEach(k => D.wire(ctx, s.paths[k]));
      keys.forEach(k => D.flow(ctx, s.paths[k], s.phase[k], C.charge, { gap: 30, r: 4.5 }));
      (st.mode === 'serie' ? [0] : [0, 1]).forEach(k => {
        const y = rPos(g, k)[1];
        D.resistor(ctx, XR, y);
        b.grips(ctx, XR, y, half(st.R[k]) + 5, pinch[k]);
        D.text(ctx, ohm(st.R[k]), XR, y - half(st.R[k]) - 30, C.ink, { size: 15, font: Sim.MONO, weight: 500 });
      });
      [0, 1].forEach(i => {
        const [x, y] = ledPos(g, i);
        D.ledSymbol(ctx, x, y, { I: m.branch[i], broken: st.broken[i], label: 'LED ' + (i + 1), rgb: Sim.led(st.led[i]).rgb });
      });
    }
  });

  // Tocar una rueda (o un LED) abre su menú: su color, y romperlo o repararlo.
  [0, 1].forEach(i => b.part({
    pos: g => ledPos(g, i),
    label: side => (side === 'w' ? 'Rueda ' : 'LED ') + (i + 1),
    menu: Sim.ledMenu({
      name: String(i + 1), get: () => st.led[i], set: id => { st.led[i] = id; },
      actions: side => [{ text: () => (st.broken[i] ? 'Reparar ' : 'Romper ') + (side === 'w' ? 'la rueda' : 'el LED'), danger: true,
        onClick: () => { st.broken[i] = !st.broken[i]; } }]
    })
  }));
  // Cada resistencia se ajusta pellizcándola o con su menú (en serie solo está la primera).
  const pinch = [0, 1].map(k => {
    const set = R => { st.R[k] = R; profiles(); };
    return b.pinch({
      pos: g => k && st.mode === 'serie' ? [-999, -999] : rPos(g, k), get: () => st.R[k], half, fromHalf, set,
      label: side => (side === 'w' ? 'Tramo angosto ' : 'Resistencia ') + (k + 1),
      text: ohm,
      menu: Sim.resistorMenu({ name: String(k + 1), values: RVALUES, get: () => st.R[k], set, format: ohm })
    });
  });
  // Botón para cambiar entre serie y paralelo.
  b.linkedButton({
    pos: g => [290, g.BOT - 72],
    text: () => st.mode === 'serie' ? 'Cambiar a paralelo' : 'Cambiar a serie',
    onClick: () => { st.mode = st.mode === 'serie' ? 'paralelo' : 'serie'; }
  });
  b.start();
})();
</script>
</body>
</html>
