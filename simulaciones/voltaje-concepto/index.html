<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voltaje = presión · Taller de Electrónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css?v=20261026003001">
<script>try{if(localStorage.getItem("sim-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<div class="sim-page">
  <div class="sim-bar">
    <a class="back" href="../../">← Simulaciones</a>
    <h1>Voltaje = presión</h1>
  </div>

  <main class="sim-stage" data-view="solo">
    <div class="sim-panel" id="pw">
      <span class="sim-tag w">Agua</span>
      <canvas aria-label="Una bomba a la izquierda empuja el agua por un tubo con dos tramos angostos en serie y la regresa por abajo; de tres puntos del tubo suben tubitos donde el agua llega a la presión de ese punto: junto a la bomba la de la bomba, y después de cada tramo angosto un escalón más abajo, hasta 0 después del último. Una válvula en el regreso: cerrada, nada corre y los tres tubitos quedan a la misma altura"></canvas>
      <div class="sim-layer"></div>
    </div>
  </main>
</div>

<script src="../../assets/sim.js?v=20261026003001"></script>
<script>
(() => {
  const { C, draw: D, fmt } = Sim;
  // La bomba (pila) sube la presión (el voltaje) del agua; los tubitos marcan la presión de cada punto (Sim.piezo).
  // Con R1 = 1 kΩ y R2 = 2 kΩ los dos escalones son distintos (con 9 V: 9 → 6 → 0). Con la válvula del regreso cerrada
  // (en el circuito, el interruptor abierto) no hay diferencia de presión en los tramos y nada corre: los tres
  // tubitos quedan a la altura de la bomba. La tierra es el punto que se llama 0: se arrastra a otro nodo y cambian
  // todos los números (la regla también), pero no las alturas, las diferencias ni la corriente.
  // Pilas comunes de 0 a 12 V: lo más son 4 mA y la de 2 kΩ recibe 32 mW (es de ¼ W). Los tramos no se cambian
  // (no llevan tarjeta).
  const R = [1000, 2000], VALUES = [0, 1.5, 3, 4.5, 6, 9, 12];
  const st = { V: 9, closed: false, ground: 'g' };
  const NODES = ['a', 'b', 'c', 'g'];
  let tb = null, drag = null, changed = false;
  const unit = w => w ? ' psi' : ' V';
  const valText = (v, w) => fmt(v, v % 1 ? 1 : 0) + unit(w);
  const setV = v => { st.V = v; changed = true; tb.syncColors(); };
  const stepV = f => { const i = VALUES.indexOf(st.V) + f; if (i >= 0 && i < VALUES.length) setV(VALUES[i]); };

  tb = Sim.piezo({
    box: document.getElementById('pw'),
    V: () => st.V, R: () => R, closed: () => st.closed, ground: () => st.ground, imax: 4,
    valveX: g => (g.X0 + g.X1) / 2 + (g.v ? 40 : 50),
    groundAt: () => drag && drag.at,
    parts: {
      v: { menu: side => ({ title: side === 'w' ? 'Bomba' : 'Pila', rows: [{ label: side === 'w' ? 'Presión' : 'Voltaje', values: VALUES, get: () => st.V, set: setV, format: v => valText(v, side === 'w') }] }), wheel: stepV },
      r: []
    },
    onView: () => relabel(),
    // la válvula del regreso (en el circuito, un interruptor)
    drawW: (ctx, g) => D.valve(ctx, g.vx, g.BOT, !st.closed, false),
    drawE: (ctx, g) => D.knifeSwitch(ctx, g.vx, g.BOT, !st.closed, false),
    tags: (ctx, g, side) => {
      const w = side === 'w', open = !st.closed;
      D.tag(ctx, g.vx, g.BOT + (w ? 38 : 40), w ? 'válvula' : 'interruptor', '', { state: w ? (open ? 'abierta' : 'cerrada') : (open ? 'cerrado' : 'abierto'), danger: !open });
      // el regreso no tiene tubito: si la tierra no está en él, su valor va abajo de él
      if (st.ground !== 'g' && !drag) {
        const [x, y] = tb.hang(g, 'g');
        D.text(ctx, tb.vText(tb.vRel('g'), w), x, y + (w ? 38 : 40), C.ink, { size: 16, font: Sim.MONO, weight: 600, bg: true });
      }
    }
  });
  tb.page = st;
  // La primera vez que se abre empieza con el color por presión (voltaje), que es de lo que trata; luego se
  // respeta el que se elija.
  try { if (!localStorage.getItem('sim-color-voltaje')) { localStorage.setItem('sim-color-voltaje', '1'); Sim.setColorMode('p'); tb.syncColors(); } } catch (e) {}

  // ---------- la válvula: un mando, tocarla la abre o la cierra ----------
  const layer = tb.p.box.querySelector('.sim-layer');
  const valve = document.createElement('button');
  valve.type = 'button'; valve.className = 'sim-hit'; valve.dataset.act = 'arm';
  const relabel = () => valve.setAttribute('aria-label', (tb.side() === 'w' ? 'Válvula: ' + (st.closed ? 'cerrada' : 'abierta') : 'Interruptor: ' + (st.closed ? 'abierto' : 'cerrado')) + '. Tocar para cambiarla');
  valve.addEventListener('click', () => { st.closed = !st.closed; relabel(); });
  layer.appendChild(valve);
  tb.at(valve, g => [g.vx, g.BOT - 10]);
  relabel();

  // ---------- la tierra: se arrastra (o se mueve con las flechas) y se queda en el nodo más cercano ----------
  const gnd = document.createElement('button');
  gnd.type = 'button'; gnd.className = 'sim-clamp'; gnd.dataset.act = 'arm';
  gnd.setAttribute('aria-label', 'Tierra (0 V)');
  layer.appendChild(gnd);
  tb.at(gnd, g => { if (drag) return drag.at; const [x, y] = tb.hang(g, st.ground); return [x, y + (Sim.PIPE + 5) + 32]; });
  const nearest = (x, y) => NODES.reduce((a, n) => { const [hx, hy] = tb.hang(tb.geo(), n), d = Math.hypot(x - hx, y - hy - 40); return d < a.d ? { n, d } : a; }, { n: st.ground, d: Infinity }).n;
  gnd.addEventListener('pointerdown', e => { gnd.setPointerCapture(e.pointerId); drag = { at: tb.toXY(e) }; e.preventDefault(); });
  gnd.addEventListener('pointermove', e => { if (!drag) return; drag.at = tb.toXY(e); tb.p.replace(); });
  const up = () => { if (!drag) return; const n = nearest(...drag.at); drag = null; setGround(n); };
  gnd.addEventListener('pointerup', up); gnd.addEventListener('pointercancel', up);
  gnd.addEventListener('keydown', e => {
    const f = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!f) return;
    e.preventDefault();
    setGround(NODES[(NODES.indexOf(st.ground) + f + NODES.length) % NODES.length]);
  });
  function setGround(n) { st.ground = n; tb.syncColors(); tb.p.replace(); }

  // ---------- pasos ----------
  // 1: la bomba sube la presión; se cumple al cambiarla (con presión). 2: con la válvula cerrada no hay diferencia en los
  // tramos y nada corre. 3: la tierra se lleva a otro nodo: los números cambian y las alturas no. 4: el circuito.
  const STEPS = ['La bomba sube la presión', 'Sin diferencia no corre', 'La tierra es 0', 'En el circuito'];
  Sim.steps(STEPS, k => { changed = false; tb.setView(k === 3 ? 'e' : 'w'); relabel(); }, k =>
    k === 0 ? changed && st.V > 0 : k === 1 ? st.closed && st.V > 0 : k === 2 ? st.ground !== 'g' : tb.done());
})();
</script>
</body>
</html>
